; ============================================================================
; ELS — Электронная Гитара Токарного Станка
; Платформа: STM32F4DISCOVERY (STM32F407VGT6)
; ============================================================================

[platformio]
default_envs = stm32f407_discovery

; ============================================================================
; Основная прошивка STM32F407
; ============================================================================
[env:stm32f407_discovery]
; версия закреплена: ststm32 20.x несёт STM32duino 3.0 (ядро ArduinoCore-API) — ядро 7e2 с ним не собирается
platform  = ststm32@19.5.0
board     = disco_f407vg
framework = arduino

; STM32duino Arduino Core — максимальная совместимость с существующим кодом
board_build.core = stm32

; Скорость загрузки через ST-Link (встроен в DISCOVERY)
upload_protocol = stlink

; Serial Monitor через STM32 USB OTG (CN5) — подключите CN5 к ПК
; Serial = USB CDC через PA11/PA12 (USB OTG FS на Discovery board)
; CN5 = нижний mini-USB разъём на плате (НЕ тот, что рядом со ST-Link!)
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_filters = send_on_enter, colorize

; Оптимизация: -O2 для скорости (критично для генерации STEP-импульсов)
; Ядро 7e2 (Core/e2: setup()/loop() и логика станка) + драйверы координат.
; orig/*.ino подключаются из e2_core.cpp как одна единица трансляции, как у Arduino IDE.
build_src_filter =
    -<*>
    +<../Core/e2/*.cpp>
    +<../Drivers/drv_dro.cpp>
    +<../Drivers/drv_scales.cpp>
    +<../Drivers/scale_protocols.cpp>

build_flags =
    -DSTM32F407xx
    -DARDUINO_DISCO_F407VG
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSBD_USE_CDC
    -O2
    -Wall
    ; char со знаком, как на AVR (на ARM по умолчанию беззнаковый)
    -fsigned-char
    ; дробные константы (0.5 и т.п.) — float, как на AVR, где double = float
    -fsingle-precision-constant
    -I.
    -ICore
    -IDrivers
    -DSERIAL_TX_BUFFER_SIZE=512
    -DSERIAL_RX_BUFFER_SIZE=256
    ; Serial (отладка) — USART1 PA9/PA10, как в els_config.h (DEBUG_UART).
    ; По умолчанию вариант Discovery вешает Serial на USART2 PA2/PA3 — тот же порт,
    ; что принимает блок DRO (DROSerial): печать в Serial роняла STM32 (HardFault).
    -DSERIAL_UART_INSTANCE=1
    -DPIN_SERIAL_RX=PA10
    -DPIN_SERIAL_TX=PA9

; Использовать FPU (аппаратная математика с плавающей точкой)
board_build.f_cpu   = 168000000L
board_build.f_flash = 8000000L

;
; Варианты с координатами от блока DRO или линеек (по умолчанию — без линеек, по шагам моторов).
; Остальные настройки — те же, что в stm32f407_discovery; меняются в Core/els_config.h.
[env:stm32f407_dro]
extends     = env:stm32f407_discovery
build_flags = ${env:stm32f407_discovery.build_flags}
    -DELS_POS_SOURCE=POS_SOURCE_DRO_UART

[env:stm32f407_scales]
extends     = env:stm32f407_discovery
build_flags = ${env:stm32f407_discovery.build_flags}
    -DELS_POS_SOURCE=POS_SOURCE_SCALES

; ============================================================================
; ESP32-S3 JC4827W543 (новый дисплей) — без изменений из Arduino-проекта
; ============================================================================
[env:jc4827w543]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board    = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder

build_src_filter = -<*> +<../ELS_Display/src/**>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DJC4827W543_DISPLAY=1
    -DSCREEN_WIDTH=480
    -DSCREEN_HEIGHT=272
    -DTFT_CS=45
    -DTFT_SCK=47
    -DTFT_D0=21
    -DTFT_D1=48
    -DTFT_D2=40
    -DTFT_D3=39
    -DTFT_BL=1
    -DTOUCH_MODULES_GT911
    -DTOUCH_SCL=4
    -DTOUCH_SDA=8
    -DTOUCH_RST=38
    -DTOUCH_INT=3
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -I.
    -IELS_Display/include

lib_deps =
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@^1.4.6
    https://github.com/mmMicky/TouchLib.git

board_build.partitions      = huge_app.csv
board_build.arduino.memory_type = qio_opi

; ============================================================================
; ESP32-P4 JC8012P4A1C (10.1" 800x1280) — MIPI-DSI + GSL3680 Touch
;
; Как собрать:
;   pio run -e jc8012p4a1c
; Как прошить:
;   pio run -e jc8012p4a1c --target upload
;
; Требования:
;   Arduino-ESP32 >= 3.1.0 (поддержка ESP32-P4)
;   pioarduino platform >= 55.03.10
; ============================================================================
[env:jc8012p4a1c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board    = esp32-p4
framework = arduino

monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder

; Компилируем из ELS_Display/src/ (общий код) + ELS_Display_P4/src/ (драйверы дисплея)
; Шрифты 4.3" заменены на ×8/3 версии из ELS_Display_P4/fonts (tools/gen_p4_fonts.sh)
build_src_filter =
    -<*>
    +<../ELS_Display/src/**>
    -<../ELS_Display/src/font_*.c>
    -<../ELS_Display/src/fonts_bold/>
    -<../ELS_Display/src/ui_design_3_industrial.cpp>
    +<../ELS_Display_P4/src/**>
    +<../ELS_Display_P4/fonts/*.c>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DJC8012P4A1C_DISPLAY=1
    -DSCREEN_WIDTH=1280
    -DSCREEN_HEIGHT=800
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -I.
    -IELS_Display_P4/include
    -IELS_Display/include
    -IELS_Display_P4/src/lcd
    -IELS_Display_P4/src/touch

lib_deps =
    lvgl/lvgl@8.4.0

board_build.partitions      = huge_app.csv
board_build.arduino.memory_type = qio_qspi

; ============================================================================
; ESP32-P4 JC1060P470 (7" 1024x600) — MIPI-DSI JD9165 + GT911 Touch. На железе не проверялось.
; Под одним названием две панели и две ревизии чипа — три прошивки (DISPLAYS.md, docs/windows/README.md):
;   jc1060p470     — корпус без метки «V2» (старая панель)
;   jc1060p470_v2  — метка «V2» на корпусе, чип ESP32-P4 ревизии 1.x
;   jc1060p470_v3  — метка «V2», чип ESP32-P4 ревизии 3.x (esptool пишет «revision v3.x»)
; Шрифты — ×32/15 от 4.3": OUT=ELS_Display_P7/fonts NUM=32 DEN=15 bash tools/gen_p4_fonts.sh
; ============================================================================
[env:jc1060p470]
extends = env:jc8012p4a1c
build_src_filter =
    -<*>
    +<../ELS_Display/src/**>
    -<../ELS_Display/src/font_*.c>
    -<../ELS_Display/src/fonts_bold/>
    -<../ELS_Display/src/ui_design_3_industrial.cpp>
    +<../ELS_Display_P7/src/**>
    +<../ELS_Display_P7/fonts/*.c>

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DJC1060P470_DISPLAY=1
    -DSCREEN_WIDTH=1024
    -DSCREEN_HEIGHT=600
    -DLV_CONF_INCLUDE_SIMPLE=1
    -DLV_LVGL_H_INCLUDE_SIMPLE=1
    -I.
    -IELS_Display_P7/include
    -IELS_Display_P4/include
    -IELS_Display/include
    -IELS_Display_P7/src/lcd
    -IELS_Display_P7/src/touch

[env:jc1060p470_v2]
extends = env:jc1060p470
build_flags = ${env:jc1060p470.build_flags} -DP7_PANEL_V2=1

[env:jc1060p470_v3]
extends = env:jc1060p470
board = esp32-p4_r3
build_flags = ${env:jc1060p470.build_flags} -DP7_PANEL_V2=1

; ============================================================================
; DRO Симулятор — Arduino Mega 2560
; ============================================================================
[env:dro_simulator]
platform  = atmelavr
board     = megaatmega2560
framework = arduino

; Симулятор — отдельный src_dir, отдельная папка
; Запускать: pio run -e dro_simulator  (из папки Simulator/dro_simulator)

monitor_speed = 115200
