2="420" y2="324" stroke="#222" stroke-width="2"/><line x1="420" y1="304" x2="440" y2="290" stroke="#222" stroke-width="2"/><line x1="440" y1="290" x2="440" y2="280" stroke="#222" stroke-width="2"/><line x1="420" y1="316" x2="440" y2="330" stroke="#222" stroke-width="2"/><line x1="440" y1="330" x2="440" y2="340" stroke="#222" stroke-width="2"/><polygon points="440,330 430,328 435,321" fill="#222"/><text x="458" y="314" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">BC547 / 2N2222</text><line x1="440" y1="340" x2="440" y2="346" stroke="#222" stroke-width="2"/><line x1="430" y1="346" x2="450" y2="346" stroke="#222" stroke-width="2"/><line x1="434" y1="350" x2="446" y2="350" stroke="#222" stroke-width="2"/><line x1="438" y1="354" x2="442" y2="354" stroke="#222" stroke-width="2"/><circle cx="370" cy="300" r="4" fill="#222"/><line x1="370" y1="300" x2="370" y2="306" stroke="#222" stroke-width="2"/><rect x="363" y="306" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="382" y="331" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">10k</text><line x1="370" y1="346" x2="370" y2="350" stroke="#222" stroke-width="2"/><line x1="360" y1="350" x2="380" y2="350" stroke="#222" stroke-width="2"/><line x1="364" y1="354" x2="376" y2="354" stroke="#222" stroke-width="2"/><line x1="368" y1="358" x2="372" y2="358" stroke="#222" stroke-width="2"/><circle cx="660" cy="350" r="4" fill="#222"/><line x1="660" y1="350" x2="760" y2="350" stroke="#222" stroke-width="2"/><text x="770" y="354" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">ENA+</text><line x1="440" y1="370" x2="440" y2="380" stroke="#222" stroke-width="2"/><line x1="440" y1="370" x2="760" y2="370" stroke="#222" stroke-width="2"/><text x="770" y="374" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">ENA−</text><line x1="220" y1="400" x2="300" y2="400" stroke="#222" stroke-width="2"/><rect x="300" y="393" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="320" y="388" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><line x1="340" y1="400" x2="400" y2="400" stroke="#222" stroke-width="2"/><circle cx="430" cy="410" r="22" fill="none" stroke="#222" stroke-width="2"/><line x1="400" y1="410" x2="420" y2="410" stroke="#222" stroke-width="2"/><line x1="420" y1="396" x2="420" y2="424" stroke="#222" stroke-width="2"/><line x1="420" y1="404" x2="440" y2="390" stroke="#222" stroke-width="2"/><line x1="440" y1="390" x2="440" y2="380" stroke="#222" stroke-width="2"/><line x1="420" y1="416" x2="440" y2="430" stroke="#222" stroke-width="2"/><line x1="440" y1="430" x2="440" y2="440" stroke="#222" stroke-width="2"/><polygon points="440,430 430,428 435,421" fill="#222"/><text x="458" y="414" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">BC547 / 2N2222</text><line x1="440" y1="440" x2="440" y2="446" stroke="#222" stroke-width="2"/><line x1="430" y1="446" x2="450" y2="446" stroke="#222" stroke-width="2"/><line x1="434" y1="450" x2="446" y2="450" stroke="#222" stroke-width="2"/><line x1="438" y1="454" x2="442" y2="454" stroke="#222" stroke-width="2"/><circle cx="370" cy="400" r="4" fill="#222"/><line x1="370" y1="400" x2="370" y2="406" stroke="#222" stroke-width="2"/><rect x="363" y="406" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="382" y="431" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">10k</text><line x1="370" y1="446" x2="370" y2="450" stroke="#222" stroke-width="2"/><line x1="360" y1="450" x2="380" y2="450" stroke="#222" stroke-width="2"/><line x1="364" y1="454" x2="376" y2="454" stroke="#222" stroke-width="2"/><line x1="368" y1="458" x2="372" y2="458" stroke="#222" stroke-width="2"/><text x="870" y="440" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">оптроны внутри</text><text x="20" y="500" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• «1» на выводе STM32 открывает транзистор → через оптрон драйвера идёт ток. Логика уровней та же, что у автора.</text><text x="20" y="518" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• 10k от базы на GND держат транзистор закрытым, пока STM32 стартует. Для оси X — такие же три ключа.</text><text x="20" y="536" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Вариант 2 — напрямую, без транзисторов: PUL+/DIR+/ENA+ драйвера → 3V платы (только если драйвер</text><text x="20" y="554" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  срабатывает от 3.3 В), PUL−/DIR−/ENA− → выводы STM32. В els_config.h: DRIVER_SIGNALS_DIRECT = 1.</text><text x="20" y="572" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Питание моторов (24–80 В) — отдельный блок, к плате STM32 не подключается. Общие только</text><text x="20" y="590" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  сигнальные провода; земли силовой части и платы не соединять.</text><text x="20" y="608" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Минимальная длительность импульса — STEP_PULSE_MIN_US (3 мкс, подходит для DM542/TB6600).</text></svg>