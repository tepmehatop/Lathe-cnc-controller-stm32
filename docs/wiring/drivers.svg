<svg xmlns="http://www.w3.org/2000/svg" width="980" height="690" viewBox="0 0 980 690"><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Драйверы шаговых моторов: STEP, DIR, ENA (по три сигнала на ось)</text><text x="20" y="62" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Вариант 1 (по умолчанию, как у автора 7e2) — через NPN-ключ: DRIVER_SIGNALS_DIRECT = 0</text><rect x="20" y="90" width="200" height="380" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="120.0" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32</text><text x="120.0" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ось Z:</text><text x="120.0" y="149" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">STEP PE9 (P1-27)</text><text x="120.0" y="166" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">DIR PE10 (P1-28)</text><text x="120.0" y="183" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ENA PE11 (P1-29)</text><text x="120.0" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333"></text><text x="120.0" y="217" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ось X:</text><text x="120.0" y="234" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">STEP PE13 (P1-31)</text><text x="120.0" y="251" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">DIR PE14 (P1-32)</text><text x="120.0" y="268" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ENA PE15 (P1-33)</text><rect x="760" y="90" width="200" height="380" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="860.0" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Драйвер мотора</text><text x="860.0" y="132" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(DM542, TB6600 и т.п.)</text><text x="640" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111">+5 В</text><line x1="660" y1="130" x2="660" y2="415" stroke="#222" stroke-width="2"/><circle cx="660" cy="150" r="4" fill="#222"/><line x1="660" y1="150" x2="760" y2="150" stroke="#222" stroke-width="2"/><text x="770" y="154" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">PUL+</text><line x1="440" y1="170" x2="440" y2="180" stroke="#222" stroke-width="2"/><line x1="440" y1="170" x2="760" y2="170" stroke="#222" stroke-width="2"/><text x="770" y="174" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">PUL−</text><line x1="220" y1="200" x2="300" y2="200" stroke="#222" stroke-width="2"/><rect x="300" y="193" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="320" y="188" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><line x1="340" y1="200" x2="400" y2="200" stroke="#222" stroke-width="2"/><circle cx="430" cy="210" r="22" fill="none" stroke="#222" stroke-width="2"/><line x1="400" y1="210" x2="420" y2="210" stroke="#222" stroke-width="2"/><line x1="420" y1="196" x2="420" y2="224" stroke="#222" stroke-width="2"/><line x1="420" y1="204" x2="440" y2="190" stroke="#222" stroke-width="2"/><line x1="440" y1="190" x2="440" y2="180" stroke="#222" stroke-width="2"/><line x1="420" y1="216" x2="440" y2="230" stroke="#222" stroke-width="2"/><line x1="440" y1="230" x2="440" y2="240" stroke="#222" stroke-width="2"/><polygon points="440,230 430,228 435,221" fill="#222"/><text x="458" y="214" font-family="Arial, sans-serif" font-size="11" text-anchor="star