<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470"><rect width="100%" height="100%" fill="#fff"/><text x="450.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">РГИ — ручной энкодер 100 линий (маховичок) и его переключатели</text><rect x="20" y="70" width="210" height="170" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="125.0" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Маховичок (MPG)</text><text x="125.0" y="112" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">+5V, GND</text><text x="125.0" y="129" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">A, B</text><text x="125.0" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(A−, B− не нужны)</text><rect x="660" y="70" width="220" height="170" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="770.0" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32</text><text x="770.0" y="112" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">A → PE7 (P1-25)</text><text x="770.0" y="129" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">B → PC13 (P2-12)</text><line x1="230" y1="130" x2="660" y2="130" stroke="#222" stroke-width="2"/><text x="242" y="124" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">A</text><circle cx="380" cy="130" r="4" fill="#222"/><line x1="380" y1="130" x2="380" y2="120" stroke="#222" stroke-width="2"/><rect x="373" y="80" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="392" y="105" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1k</text><text x="390" y="76" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">3V</text><circle cx="540" cy="130" r="4" fill="#222"/><line x1="540" y1="130" x2="540" y2="136" stroke="#222" stroke-width="2"/><line x1="530" y1="136" x2="550" y2="136" stroke="#222" stroke-width="2"/><line x1="530" y1="141" x2="550" y2="141" stroke="#222" stroke-width="2"/><line x1="540" y1="141" x2="540" y2="150" stroke="#222" stroke-width="2"/><line x1="530" y1="150" x2="550" y2="150" stroke="#222" stroke-width="2"/><line x1="534" y1="154" x2="546" y2="154" stroke="#222" stroke-width="2"/><line x1="538" y1="158" x2="542" y2="158" stroke="#222" stroke-width="2"/><text x="556" y="144" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">10 нФ</text><line x1="230" y1="190" x2="660" y2="190" stroke="#222" stroke-width="2"/><text x="242" y="184" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">B</text><circle cx="450" cy="190" r="4" fill="#222"/><line x1="450" y1="190" x2="450" y2="180" stroke="#222" stroke-width="2"/><rect x="443" y="140" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="462" y="165" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1k</text><text x="460" y="136" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">3V</text><circle cx="540" cy="190" r="4" fill="#222"/><line x1="540" y1="190" x2="540" y2="196" stroke="#222" stroke-width="2"/><line x1="530" y1="196" x2="550" y2="196" stroke="#222" stroke-width="2"/><line x1="530" y1="201" x2="550" y2="201" stroke="#222" stroke-width="2"/><line x1="540" y1="201" x2="540" y2="210" stroke="#222" stroke-width="2"/><line x1="530" y1="210" x2="550" y2="210" stroke="#222" stroke-width="2"/><line x1="534" y1="214" x2="546" y2="214" stroke="#222" stroke-width="2"/><line x1="538" y1="218" x2="542" y2="218" stroke="#222" stroke-width="2"/><text x="556" y="204" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">10 нФ</text><text x="20" y="280" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#111">Переключатель оси (3 положения): Z — PC10 (P2-37), выкл., X — PC12 (P2-35); общий — GND</text><text x="20" y="302" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#111">Переключатель масштаба: ×1 — PA4 (P1-16), ×10 — PD8 (P1-40); общий — GND</text><text x="20" y="335" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Конденсаторы 10 нФ на линиях A и B — совет автора 7e2 против ложных щелчков.</text><text x="20" y="353" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Выходы маховичка 5 В допустимы: PE7 и PC13 терпят 5 В. Если выход «открытый коллектор» —</text><text x="20" y="371" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  работает через подтяжку 1k к 3V.</text><text x="20" y="389" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• PA4 (×1) НЕ терпит 5 В — только контакт на GND и подтяжка к 3V.</text><text x="20" y="407" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Направление вращения — HC_Z_DIR / HC_X_DIR в els_config.h.</text></svg>