<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="100%" height="100%" fill="#fff"/><text x="450.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Светодиоды упоров, зуммер, тахометр, переменник подачи</text><text x="20" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Светодиод упора (4 шт.)</text><text x="20" y="98" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">3V</text><line x1="45" y1="94" x2="120" y2="94" stroke="#222" stroke-width="2"/><polygon points="120,82 120,106 142,94" fill="#fff" stroke="#222" stroke-width="2"/><line x1="142" y1="82" x2="142" y2="106" stroke="#222" stroke-width="2"/><line x1="142" y1="94" x2="180" y2="94" stroke="#222" stroke-width="2"/><rect x="180" y="87" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="200" y="82" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">220 Ом</text><line x1="220" y1="94" x2="300" y2="94" stroke="#222" stroke-width="2"/><text x="310" y="98" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">→ PE6 / PE5 / PE4 / PE2 (Левый / Правый / Передний / Задний)</text><text x="20" y="126" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#444">Светится при «0» на выводе — как у автора (у него 470–680 Ом к +5 В; здесь 220 Ом к 3V).</text><text x="20" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Зуммер (активный, 5 В)</text><text x="20" y="214" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">+5V</text><line x1="50" y1="210" x2="120" y2="210" stroke="#222" stroke-width="2"/><rect x="120" y="190" width="100" height="40" rx="6" fill="#fff" stroke="#335" stroke-width="2"/><text x="170.0" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">зуммер</text><line x1="220" y1="210" x2="300" y2="210" stroke="#222" stroke-width="2"/><line x1="300" y1="210" x2="300" y2="230" stroke="#222" stroke-width="2"/><circle cx="290" cy="260" r="22" fill="none" stroke="#222" stroke-width="2"/><line x1="260" y1="260" x2="280" y2="260" stroke="#222" stroke-width="2"/><line x1="280" y1="246" x2="280" y2="274" stroke="#222" stroke-width="2"/><line x1="280" y1="254" x2="300" y2="240" stroke="#222" stroke-width="2"/><line x1="300" y1="240" x2="300" y2="230" stroke="#222" stroke-width="2"/><line x1="280" y1="266" x2="300" y2="280" stroke="#222" stroke-width="2"/><line x1="300" y1="280" x2="300" y2="290" stroke="#222" stroke-width="2"/><polygon points="300,280 290,278 295,271" fill="#222"/><text x="318" y="264" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">BC547</text><line x1="300" y1="290" x2="300" y2="298" stroke="#222" stroke-width="2"/><line x1="290" y1="298" x2="310" y2="298" stroke="#222" stroke-width="2"/><line x1="294" y1="302" x2="306" y2="302" stroke="#222" stroke-width="2"/><line x1="298" y1="306" x2="302" y2="306" stroke="#222" stroke-width="2"/><line x1="140" y1="260" x2="220" y2="260" stroke="#222" stroke-width="2"/><rect x="220" y="253" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="240" y="248" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><line x1="140" y1="260" x2="140" y2="260" stroke="#222" stroke-width="2"/><text x="20" y="264" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">PE12 (P1-30) →</text><text x="380" y="264" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#444">BEEPER_ON_LEVEL = 1 (звук при «1»)</text><text x="20" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Тахометр (выход)</text><text x="20" y="376" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">PE8 (P1-26) → вход тахометра: импульс на каждый оборот шпинделя, уровень 3.3 В.</text><text x="20" y="394" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#444">Если тахометру нужно 5 В — тот же NPN-ключ, что для зуммера.</text><text x="20" y="440" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Переменник подачи 10k (если есть, USE_FEED_POT = 1)</text><text x="20" y="466" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Крайние выводы — 3V и GND платы (НЕ 5 В!), средний → PC1 (P1-7).</text><text x="20" y="484" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#444">Без переменника — USE_FEED_POT = 0: подача задаётся с дисплея и кнопками.</text></svg>