<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400"><rect width="100%" height="100%" fill="#fff"/><text x="410.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Любая кнопка, переключатель, концевик → STM32</text><rect x="560" y="70" width="230" height="150" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="675.0" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32 (Discovery)</text><text x="675.0" y="112" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">вывод из таблицы</text><text x="675.0" y="129" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(например PB13 — «Влево»)</text><text x="60" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111">3V платы</text><line x1="110" y1="100" x2="110" y2="120" stroke="#222" stroke-width="2"/><rect x="103" y="120" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="122" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1k</text><line x1="110" y1="160" x2="110" y2="180" stroke="#222" stroke-width="2"/><circle cx="110" cy="180" r="4" fill="#222"/><line x1="110" y1="180" x2="560" y2="180" stroke="#222" stroke-width="2"/><line x1="110" y1="180" x2="110" y2="220" stroke="#222" stroke-width="2"/><line x1="110" y1="220" x2="95" y2="245" stroke="#222" stroke-width="2"/><circle cx="110" cy="220" r="4" fill="#222"/><line x1="110" y1="252" x2="110" y2="270" stroke="#222" stroke-width="2"/><line x1="100" y1="270" x2="120" y2="270" stroke="#222" stroke-width="2"/><line x1="104" y1="274" x2="116" y2="274" stroke="#222" stroke-width="2"/><line x1="108" y1="278" x2="112" y2="278" stroke="#222" stroke-width="2"/><text x="130" y="245" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">кнопка / контакт переключателя</text><text x="122" y="286" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">GND</text><circle cx="330" cy="180" r="4" fill="#222"/><line x1="330" y1="180" x2="330" y2="200" stroke="#222" stroke-width="2"/><line x1="330" y1="200" x2="330" y2="214" stroke="#222" stroke-width="2"/><line x1="320" y1="214" x2="340" y2="214" stroke="#222" stroke-width="2"/><line x1="320" y1="220" x2="340" y2="220" stroke="#222" stroke-width="2"/><line x1="330" y1="220" x2="330" y2="230" stroke="#222" stroke-width="2"/><line x1="320" y1="230" x2="340" y2="230" stroke="#222" stroke-width="2"/><line x1="324" y1="234" x2="336" y2="234" stroke="#222" stroke-width="2"/><line x1="328" y1="238" x2="332" y2="238" stroke="#222" stroke-width="2"/><text x="344" y="220" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">100 нФ (по желанию)</text><text x="20" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Не нажато: на выводе 1 (3.3 В через 1k). Нажато: 0 (замкнуто на GND).</text><text x="20" y="343" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Резистор 1k — как у автора 7e2, но к 3V платы, НЕ к +5 В. Внутренняя подтяжка STM32 тоже</text><text x="20" y="361" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  включена; внешняя 1k нужна для помехоустойчивости на длинных проводах пульта.</text><text x="20" y="379" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Галетный переключатель: общий контакт — на GND, каждое положение — на свой вывод.</text></svg>