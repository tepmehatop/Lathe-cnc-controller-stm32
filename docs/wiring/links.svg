<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="100%" height="100%" fill="#fff"/><text x="450.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Связь: сенсорный дисплей, LCD2004, блок DRO, отладочный порт</text><rect x="330" y="60" width="230" height="380" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="445.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32 Discovery</text><text x="445.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PB10 (P1-34)</text><text x="445.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PB11 (P1-35)</text><text x="445.0" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333"></text><text x="445.0" y="153" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PB6 (P2-23)</text><text x="445.0" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PB7 (P2-24)</text><text x="445.0" y="187" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333"></text><text x="445.0" y="204" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PA3 (P1-13)</text><text x="445.0" y="221" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333"></text><text x="445.0" y="238" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PA9 (P2-44)</text><text x="445.0" y="255" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PA10 (P2-41)</text><text x="445.0" y="272" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333"></text><text x="445.0" y="289" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">GND</text><rect x="20" y="60" width="230" height="120" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="135.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Дисплей ESP32</text><text x="135.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">4.3" JC4827W543 или</text><text x="135.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">10.1" JC8012P4A1C</text><text x="135.0" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(разъём UART)</text><line x1="250" y1="100" x2="330" y2="100" stroke="#222" stroke-width="2"/><text x="290" y="94" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111">RX ← PB10</text><line x1="250" y1="130" x2="330" y2="130" stroke="#222" stroke-width="2"/><text x="290" y="124" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111">TX → PB11</text><rect x="20" y="200" width="230" height="90" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="135.0" y="222" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">LCD2004 + I2C-модуль</text><text x="135.0" y="242" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">VCC → +5 В, GND</text><text x="135.0" y="259" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">адрес 0x27 (или 0x3F)</text><line x1="250" y1="230" x2="330" y2="230" stroke="#222" stroke-width="2"/><text x="290" y="224" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111">SCL → PB6</text><line x1="250" y1="260" x2="330" y2="260" stroke="#222" stroke-width="2"/><text x="290" y="254" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111">SDA → PB7</text><rect x="620" y="180" width="260" height="90" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="750.0" y="202" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Блок DRO HS800-2</text><text x="750.0" y="222" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">TX блока → PA3</text><text x="750.0" y="239" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">GND → GND</text><line x1="560" y1="225" x2="620" y2="225" stroke="#222" stroke-width="2"/><rect x="620" y="300" width="260" height="110" rx="6" fill="#fff6f6" stroke="#335" stroke-width="2"/><text x="750.0" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">USB-UART (CP2102, CH340)</text><text x="750.0" y="342" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">для отладки и команд</text><text x="750.0" y="359" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">RX адаптера ← PA9</text><text x="750.0" y="376" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">TX адаптера → PA10</text><text x="750.0" y="393" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">115200</text><line x1="560" y1="340" x2="620" y2="340" stroke="#222" stroke-width="2"/><line x1="560" y1="370" x2="620" y2="370" stroke="#222" stroke-width="2"/><text x="20" y="460" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Все связи — 3.3 В; общий GND у всех устройств. Дисплей питается от своего USB/5 В.</text><text x="20" y="478" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Модуль LCD2004 подтягивает SDA/SCL к 5 В — выводы PB6/PB7 это выдерживают.</text></svg>