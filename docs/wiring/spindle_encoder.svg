<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="100%" height="100%" fill="#fff"/><text x="450.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Энкодер шпинделя → STM32 (PA1 — канал A, PA8 — канал B)</text><text x="20" y="66" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Вариант 1 — промышленный энкодер с выходом NPN «открытый коллектор»</text><text x="20" y="84" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#444">(Omron E6B2-CWZ6C, Autonics E40S и аналоги, питание 5–24 В)</text><rect x="20" y="100" width="200" height="160" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="120.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Энкодер</text><text x="120.0" y="142" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">коричн. — +5…24 В</text><text x="120.0" y="159" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">синий — GND</text><text x="120.0" y="176" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">чёрный — A</text><text x="120.0" y="193" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">белый — B</text><rect x="660" y="100" width="220" height="160" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="770.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32</text><text x="770.0" y="142" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">A → PA1 (P1-11)</text><text x="770.0" y="159" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">B → PA8 (P2-43)</text><text x="770.0" y="176" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">GND → GND</text><line x1="220" y1="150" x2="660" y2="150" stroke="#222" stroke-width="2"/><text x="232" y="144" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">A</text><circle cx="380" cy="150" r="4" fill="#222"/><line x1="380" y1="150" x2="380" y2="140" stroke="#222" stroke-width="2"/><rect x="373" y="100" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="392" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1k</text><text x="390" y="96" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">3V</text><circle cx="540" cy="150" r="4" fill="#222"/><line x1="540" y1="150" x2="540" y2="156" stroke="#222" stroke-width="2"/><line x1="530" y1="156" x2="550" y2="156" stroke="#222" stroke-width="2"/><line x1="530" y1="161" x2="550" y2="161" stroke="#222" stroke-width="2"/><line x1="540" y1="161" x2="540" y2="170" stroke="#222" stroke-width="2"/><line x1="530" y1="170" x2="550" y2="170" stroke="#222" stroke-width="2"/><line x1="534" y1="174" x2="546" y2="174" stroke="#222" stroke-width="2"/><line x1="538" y1="178" x2="542" y2="178" stroke="#222" stroke-width="2"/><text x="556" y="164" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">1 нФ</text><line x1="220" y1="210" x2="660" y2="210" stroke="#222" stroke-width="2"/><text x="232" y="204" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">B</text><circle cx="450" cy="210" r="4" fill="#222"/><line x1="450" y1="210" x2="450" y2="200" stroke="#222" stroke-width="2"/><rect x="443" y="160" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="462" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1k</text><text x="460" y="156" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">3V</text><circle cx="540" cy="210" r="4" fill="#222"/><line x1="540" y1="210" x2="540" y2="216" stroke="#222" stroke-width="2"/><line x1="530" y1="216" x2="550" y2="216" stroke="#222" stroke-width="2"/><line x1="530" y1="221" x2="550" y2="221" stroke="#222" stroke-width="2"/><line x1="540" y1="221" x2="540" y2="230" stroke="#222" stroke-width="2"/><line x1="530" y1="230" x2="550" y2="230" stroke="#222" stroke-width="2"/><line x1="534" y1="234" x2="546" y2="234" stroke="#222" stroke-width="2"/><line x1="538" y1="238" x2="542" y2="238" stroke="#222" stroke-width="2"/><text x="556" y="224" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">1 нФ</text><text x="20" y="285" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Выход NPN сам тянет линию к земле; подтяжка 1k к 3V даёт «1» безопасного уровня 3.3 В.</text><text x="20" y="303" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• 1 нФ на землю у самой платы глушит иголки от двигателя шпинделя и ЧП.</text><text x="20" y="321" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Число линий — ENC_LINE_PER_REV в els_config.h (у автора 1800).</text><text x="20" y="370" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">Вариант 2 — самодельный оптический датчик (как у автора 7e2): компаратор LM393</text><rect x="20" y="390" width="180" height="120" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="110.0" y="412" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Фотодатчики</text><text x="110.0" y="432" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">аналоговый сигнал</text><text x="110.0" y="449" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">A и B</text><rect x="300" y="390" width="220" height="120" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="410.0" y="412" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">LM393 (питание 5 В)</text><text x="410.0" y="432" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">порог — подстроечник 3–5k</text><text x="410.0" y="449" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">гистерезис — 22k</text><text x="410.0" y="466" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">из выхода на вход +</text><rect x="660" y="390" width="220" height="120" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="770.0" y="412" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32</text><text x="770.0" y="432" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">A → PA1</text><text x="770.0" y="449" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">B → PA8</text><line x1="200" y1="450" x2="300" y2="450" stroke="#222" stroke-width="2"/><line x1="520" y1="450" x2="660" y2="450" stroke="#222" stroke-width="2"/><circle cx="600" cy="450" r="4" fill="#222"/><line x1="600" y1="450" x2="600" y2="440" stroke="#222" stroke-width="2"/><rect x="593" y="400" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="612" y="425" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1k</text><text x="612" y="384" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#111">3V (не 5 В!)</text><text x="20" y="540" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Выход LM393 — открытый коллектор: подтяжку выхода сделать к 3V платы, а не к +5 В, как было на Mega.</text><text x="20" y="558" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Остальная схема (делитель порога, 22k гистерезиса) — без изменений.</text></svg>