<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="100%" height="100%" fill="#fff"/><text x="450.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Стенд без станка: Arduino Mega изображает блок DRO и линейки</text><rect x="20" y="70" width="250" height="340" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="145.0" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Arduino Mega 2560</text><text x="145.0" y="112" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">прошивка</text><text x="145.0" y="129" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Simulator/dro_simulator</text><rect x="630" y="70" width="250" height="340" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="755.0" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32 Discovery</text><text x="755.0" y="112" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">штырьки: PA3 P1-13,</text><text x="755.0" y="129" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PA15 P2-40, PB3 P2-28,</text><text x="755.0" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PB4 P2-25, PB5 P2-26,</text><text x="755.0" y="163" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">PC6 P2-47, PC7 P2-48</text><line x1="270" y1="162" x2="630" y2="162" stroke="#222" stroke-width="2"/><rect x="330" y="155" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="350" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><text x="450" y="157" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">TX1 → PA3</text><text x="560" y="157" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">пакеты блока DRO</text><line x1="270" y1="191" x2="630" y2="191" stroke="#222" stroke-width="2"/><rect x="330" y="184" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="350" y="179" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><text x="450" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">D22 → PA15</text><text x="560" y="186" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">линейка Z: A/такт</text><line x1="270" y1="220" x2="630" y2="220" stroke="#222" stroke-width="2"/><rect x="330" y="213" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="350" y="208" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><text x="450" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">D23 → PB3</text><text x="560" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">линейка Z: B/данные</text><line x1="270" y1="249" x2="630" y2="249" stroke="#222" stroke-width="2"/><rect x="330" y="242" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="350" y="237" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><text x="450" y="244" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">D24 → PB4</text><text x="560" y="244" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">линейка X: A/такт</text><line x1="270" y1="278" x2="630" y2="278" stroke="#222" stroke-width="2"/><rect x="330" y="271" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="350" y="266" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><text x="450" y="273" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">D25 → PB5</text><text x="560" y="273" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">линейка X: B/данные</text><line x1="270" y1="307" x2="630" y2="307" stroke="#222" stroke-width="2"/><rect x="330" y="300" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="350" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><text x="450" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">D26 ← PC6</text><text x="560" y="302" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">REQ Z (Digimatic)</text><line x1="270" y1="336" x2="630" y2="336" stroke="#222" stroke-width="2"/><rect x="330" y="329" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="350" y="324" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><text x="450" y="331" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">D27 ← PC7</text><text x="560" y="331" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">REQ X (Digimatic)</text><line x1="270" y1="365" x2="630" y2="365" stroke="#222" stroke-width="2"/><text x="450" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">GND — GND</text><text x="560" y="360" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#444">общая земля</text><text x="20" y="440" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Резисторы 1k защищают выводы: Mega работает от 5 В, STM32 — от 3.3 В.</text><text x="20" y="458" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Для режима «блок DRO» достаточно двух проводов: TX1 → PA3 и GND.</text><text x="20" y="476" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Обе платы — по USB к компьютеру: Mega (команды эмулятора, 115200) и ST-Link Discovery (прошивка).</text><text x="20" y="494" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Режим линеек в эмуляторе: команда m&lt;буква&gt; (mq квадратура, ms Sylvac, mb BIN6, mi iGaging, md Digimatic).</text></svg>