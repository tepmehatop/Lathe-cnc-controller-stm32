<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520"><rect width="100%" height="100%" fill="#fff"/><text x="490.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Из чего состоит электронная гитара на STM32</text><rect x="370" y="190" width="240" height="130" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="490.0" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32F4DISCOVERY</text><text x="490.0" y="232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">мозг: считает резьбы,</text><text x="490.0" y="249" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">подачи, упоры</text><rect x="20" y="40" width="260" height="110" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="150.0" y="62" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Сенсорный дисплей</text><text x="150.0" y="82" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ESP32 4.3" или 10.1"</text><text x="150.0" y="99" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">кнопки на экране + показания</text><rect x="20" y="190" width="260" height="130" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="150.0" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Пульт</text><text x="150.0" y="232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">переключатели режима,</text><text x="150.0" y="249" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">кнопки, джойстик, упоры,</text><text x="150.0" y="266" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">РГИ, LCD2004 (запасной)</text><rect x="20" y="370" width="260" height="11