<text x='420' y='184' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#6b5a1c' text-anchor='middle' font-weight='normal'><tspan x='420' dy='0.0'>10</tspan></text>
<line x1='60' y1='210' x2='420' y2='210' stroke='#eb6834' stroke-width='2.5' marker-end='url(#aeb6834)' marker-start='url(#seb6834)'/>
<text x='240' y='232' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#eb6834' text-anchor='middle' font-weight='bold'><tspan x='240' dy='0.0'>10 мм — 5 витков (от гребня до гребня)</tspan></text>
<text x='40' y='266' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='40' dy='0.0'>Шаг = 10 мм / число витков = 10 / 5 = 2.00 мм</tspan></text>
<text x='40' y='292' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'><tspan x='40' dy='0.0'>Двухзаходный винт (две «дорожки» рядом) — шаг</tspan><tspan x='40' dy='16.2'>вдвое больше: считайте по одной дорожке.</tspan></text>
<text x='40' y='340' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'><tspan x='40' dy='0.0'>Дюймовый винт: посчитайте витки на 25.4 мм (1 дюйм).</tspan><tspan x='40' dy='16.2'>Шаг = 25.4 / витков: 8 ниток → 3.18 мм, 10 → 2.54,</tspan><tspan x='40' dy='16.2'>12 → 2.12. На экран — 2 знака после точки.</tspan></text>
<text x='520' y='70' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='16' fill='#2a78d6' text-anchor='start' font-weight='bold'><tspan x='520' dy='0.0'>Способ 2. Провернуть винт на 1 оборот</tspan></text>
<circle cx='590' cy='170' r='52' fill='#c9ccd1' stroke='#8f949b' stroke-width='3'/>
