th='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker><marker id='s52514e' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#52514e'/></marker></defs>
<rect width='100%' height='100%' fill='#fcfcfb' rx='10'/>
<text x='24' y='34' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='19' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='24' dy='0.0'>Шаг винта: два способа узнать на своём станке</tspan></text>
<text x='24' y='70' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='16' fill='#2a78d6' text-anchor='start' font-weight='bold'><tspan x='24' dy='0.0'>Способ 1. Посчитать витки на 10 мм</tspan></text>
<rect x='40' y='92' width='420' height='44' rx='4' fill='#dfe2e6' stroke='#8f949b' stroke-width='1.5' />
