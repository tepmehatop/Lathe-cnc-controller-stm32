<line x1='760' y1='230' x2='840' y2='230' stroke='#eb6834' stroke-width='2.5' marker-end='url(#aeb6834)'/>
<text x='800' y='252' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#eb6834' text-anchor='middle' font-weight='bold'><tspan x='800' dy='0.0'>проехала = шаг</tspan></text>
<text x='520' y='296' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='520' dy='0.0'>1. Выберите люфт: поверните винт немного вперёд.</tspan><tspan x='520' dy='17.5'>2. Обнулите индикатор, штангенциркуль или DRO.</tspan><tspan x='520' dy='17.5'>3. Поверните винт ровно на 1 оборот по метке.</tspan><tspan x='520' dy='17.5'>4. Сколько проехала каретка — это шаг винта.</tspan><tspan x='520' dy='17.5'>   Точнее: 10 оборотов и разделить на 10.</tspan></text>
<text x='520' y='430' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#8a8984' text-anchor='start' font-weight='normal'><tspan x='520' dy='0.0'>Мотор уже стоит? Поверните его вал рукой с выключенным</tspan><tspan x='520' dy='16.2'>драйвером (или кнопкой «Энергосбережение»).</tspan></text>
