<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 330' width='960' height='330' role='img' aria-label='Энкодер: линии на оборот шпинделя, с учётом передачи'>
<title>Энкодер: линии на оборот шпинделя, с учётом передачи</title>
<defs><marker id='a1b1b1a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1b1b1a'/></marker><marker id='s1b1b1a' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#1b1b1a'/></marker><marker id='a2a78d6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2a78d6'/></marker><marker id='s2a78d6' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#2a78d6'/></marker><marker id='aeb6834' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#eb6834'/></marker><marker id='seb6834' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#eb6834'/></marker><marker id='a1baf7a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1baf7a'/></marker><marker id='s1baf7a' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#1baf7a'/></marker><marker id='a6250d6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6250d6'/></marker><marker id='s6250d6' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#6250d6'/></marker><marker id='ad03b3b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d03b3b'/></marker><marker id='sd03b3b' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#d03b3b'/></marker><marker id='a52514e' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker><marker id='s52514e' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#52514e'/></marker></defs>
<rect width='100%' height='100%' fill='#fcfcfb' rx='10'/>
<text x='24' y='34' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='19' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='24' dy='0.0'>ЭНКОДЕР — линий на один оборот ШПИНДЕЛЯ</tspan></text>
<circle cx='130' cy='150' r='60' fill='#2f6fb8' stroke='#1d4f8a' stroke-width='3'/>
<circle cx='130' cy='150' r='12' fill='#cfd3d8'/>
<text x='130' y='135' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='11' fill='#ffffff' text-anchor='middle' font-weight='normal'><tspan x='130' dy='0.0'>E6B2-CWZ6C</tspan></text>
<text x='130' y='182' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#ffd34d' text-anchor='middle' font-weight='bold'><tspan x='130' dy='0.0'>1000P/R</tspan></text>
<text x='40' y='250' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='40' dy='0.0'>На корпусе: «1000P/R», «1000 PPR»,</tspan><tspan x='40' dy='17.5'>«1000 lines» — это 1000 линий.</tspan><tspan x='40' dy='17.5'>На экран — 1000.</tspan></text>
<text x='400' y='80' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#2a78d6' text-anchor='start' font-weight='bold'><tspan x='400' dy='0.0'>Как энкодер связан со шпинделем</tspan></text>
<text x='400' y='112' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='400' dy='0.0'>• Напрямую или шестерни 1:1 → линий = как на энкодере (1000).</tspan></text>
<text x='400' y='140' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='400' dy='0.0'>• Энкодер крутится БЫСТРЕЕ шпинделя: шестерня шпинделя 60 зуб.,</tspan></text>
<text x='420' y='160' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='420' dy='0.0'>энкодера 30 → 1000 × 60 / 30 = 2000 линий.</tspan></text>
<text x='400' y='188' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='400' dy='0.0'>• Медленнее — так же по формуле: 1000 × 30 / 60 = 500.</tspan></text>
<text x='400' y='230' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#d03b3b' text-anchor='start' font-weight='normal'><tspan x='400' dy='0.0'>Не путайте линии с «импульсами ×4»: продавцы иногда пишут</tspan><tspan x='400' dy='16.2'>4000 для энкодера на 1000 линий. На экран — именно линии.</tspan></text>
<text x='400' y='286' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#8a8984' text-anchor='start' font-weight='normal'><tspan x='400' dy='0.0'>По умолчанию 1800 — из конфигурации автора 7e2.</tspan></text>
</svg>
