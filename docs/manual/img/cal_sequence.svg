<text x='260' y='90' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='260' dy='0.0'>Обнулите</tspan><tspan x='260' dy='17.5'>индикатор</tspan></text>
