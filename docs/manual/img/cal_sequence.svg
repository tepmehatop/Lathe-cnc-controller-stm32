<text x='610' y='97' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#ffffff' text-anchor='middle' font-weight='bold'><tspan x='610' dy='0.0'>4</tspan></text>
<text x='632' y='90' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='632' dy='0.0'>Ось едет назад</tspan><tspan x='632' dy='17.5'>на 8 мм</tspan></text>
<circle cx='673' cy='200' r='40' fill='#ffffff' stroke='#333' stroke-width='3'/>
<text x='673' y='207' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='18' fill='#d03b3b' text-anchor='middle' font-weight='bold'><tspan x='673' dy='0.0'>0.06</tspan></text>
<text x='602' y='280' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'><tspan x='602' dy='0.0'>введите показание:</tspan><tspan x='602' dy='16.2'>0.06 → ВВОД</tspan><tspan x='602' dy='16.2'>(это люфт)</tspan></text>
<line x1='760' y1='220' x2='772' y2='220' stroke='#8a8984' stroke-width='2' marker-end='url(#a8a8984)'/>
<rect x='774' y='70' width='170' height='300' rx='8' fill='#ffffff' stroke='#e4e3df' stroke-width='1.5' />
<circle cx='796' cy='92' r='13' fill='#2a78d6'/>
<text x='796' y='97' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#ffffff' text-anchor='middle' font-weight='bold'><tspan x='796' dy='0.0'>5</tspan></text>
<text x='818' y='90' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='818' dy='0.0'>Итог</tspan></text>
<line x1='814' y1='200' x2='904' y2='200' stroke='#1baf7a' stroke-width='3'/>
<text x='859' y='192' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='34' fill='#1baf7a' text-anchor='middle' font-weight='bold'><tspan x='859' dy='0.0'>✓</tspan></text>
<text x='788' y='280' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'><tspan x='788' dy='0.0'>винт = 2.00×8.04/8</tspan><tspan x='788' dy='16.2'>= 2.01 мм,</tspan><tspan x='788' dy='16.2'>люфт 60 мкм</tspan><tspan x='788' dy='16.2'>→ ПРИМЕНИТЬ</tspan></text>
