<text x='230' y='280' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'><tspan x='230' dy='0.0'>поверните шкалу</tspan><tspan x='230' dy='16.2'>на 0 → ДАЛЕЕ</tspan></text>
