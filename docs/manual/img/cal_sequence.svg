<text x='416' y='280' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'><tspan x='416' dy='0.0'>введите показание:</tspan><tspan x='416' dy='16.2'>8.04 → ВВОД</tspan></text>
