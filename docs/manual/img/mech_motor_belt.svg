<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 400' width='960' height='400' role='img' aria-label='Шагов на оборот: по шильдику мотора и с учётом ремня или шестерён'>
<title>Шагов на оборот: по шильдику мотора и с учётом ремня или шестерён</title>
<defs><marker id='a1b1b1a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1b1b1a'/></marker><marker id='s1b1b1a' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#1b1b1a'/></marker><marker id='a2a78d6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#2a78d6'/></marker><marker id='s2a78d6' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#2a78d6'/></marker><marker id='aeb6834' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#eb6834'/></marker><marker id='seb6834' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#eb6834'/></marker><marker id='a1baf7a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1baf7a'/></marker><marker id='s1baf7a' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#1baf7a'/></marker><marker id='a6250d6' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#6250d6'/></marker><marker id='s6250d6' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#6250d6'/></marker><marker id='ad03b3b' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#d03b3b'/></marker><marker id='sd03b3b' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#d03b3b'/></marker><marker id='a52514e' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#52514e'/></marker><marker id='s52514e' viewBox='0 0 10 10' refX='1' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M10,0 L0,5 L10,10 z' fill='#52514e'/></marker></defs>
<rect width='100%' height='100%' fill='#fcfcfb' rx='10'/>
<text x='24' y='34' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='19' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='24' dy='0.0'>ШАГОВ НА ОБОРОТ — шаги мотора на один оборот ВИНТА (без микрошага)</tspan></text>
<rect x='40' y='70' width='320' height='150' rx='8' fill='#eef0f2' stroke='#8f949b' stroke-width='1.5' />
<text x='60' y='100' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#52514e' text-anchor='start' font-weight='bold'><tspan x='60' dy='0.0'>Шильдик мотора</tspan></text>
<text x='60' y='130' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='60' dy='0.0'>57HS76-3004  NEMA23</tspan></text>
<text x='60' y='155' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='16' fill='#d03b3b' text-anchor='start' font-weight='bold'><tspan x='60' dy='0.0'>STEP ANGLE: 1.8°</tspan></text>
<text x='60' y='180' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='60' dy='0.0'>RATED CURRENT: 3.0 A</tspan></text>
<text x='60' y='205' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='60' dy='0.0'>HOLDING TORQUE: 1.9 N·m</tspan></text>
<text x='40' y='252' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='40' dy='0.0'>Шагов = 360° / угол шага</tspan></text>
<text x='40' y='278' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='40' dy='0.0'>1.8° → 360 / 1.8 = 200 (почти все моторы)</tspan><tspan x='40' dy='17.5'>0.9° → 360 / 0.9 = 400</tspan></text>
<text x='40' y='330' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1baf7a' text-anchor='start' font-weight='bold'><tspan x='40' dy='0.0'>Мотор прямо на винте (муфта) — пишите 200.</tspan></text>
<text x='500' y='80' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='15' fill='#2a78d6' text-anchor='start' font-weight='bold'><tspan x='500' dy='0.0'>Мотор крутит винт через ремень или шестерни</tspan></text>
<circle cx='560' cy='190' r='34' fill='#c9ccd1' stroke='#8f949b' stroke-width='3'/>
<circle cx='800' cy='190' r='68' fill='#c9ccd1' stroke='#8f949b' stroke-width='3'/>
<path d='M560,156 L800,122 M560,224 L800,258' fill='none' stroke='#3b3f45' stroke-width='5'/>
<text x='560' y='196' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='18' fill='#1b1b1a' text-anchor='middle' font-weight='bold'><tspan x='560' dy='0.0'>20</tspan></text>
<text x='800' y='196' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='22' fill='#1b1b1a' text-anchor='middle' font-weight='bold'><tspan x='800' dy='0.0'>40</tspan></text>
<text x='560' y='250' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='middle' font-weight='normal'><tspan x='560' dy='0.0'>на моторе</tspan><tspan x='560' dy='16.2'>20 зубьев</tspan></text>
<text x='800' y='284' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='middle' font-weight='normal'><tspan x='800' dy='0.0'>на винте — 40 зубьев</tspan></text>
<text x='500' y='330' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='16' fill='#1b1b1a' text-anchor='start' font-weight='bold'><tspan x='500' dy='0.0'>Шагов на оборот = 200 × 40 / 20 = 400</tspan></text>
<text x='500' y='356' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#52514e' text-anchor='start' font-weight='normal'><tspan x='500' dy='0.0'>зубья на винте / зубья на моторе; шестерни — так же.</tspan><tspan x='500' dy='16.2'>Если получилось дробное — выберите шкивы, где делится нацело.</tspan></text>
</svg>
