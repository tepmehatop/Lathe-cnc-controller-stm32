<text x='40' y='330' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='40' dy='0.0'>• Стойка — на СТАНИНУ, ножка упирается в торец</tspan><tspan x='40' dy='17.5'>  каретки ВДОЛЬ оси Z.</tspan><tspan x='40' dy='17.5'>• Натяг 1–2 мм: ножка должна ходить в обе стороны.</tspan><tspan x='40' dy='17.5'>• Ход калибровки меньше хода индикатора:</tspan><tspan x='40' dy='17.5'>  индикатор 10 мм → ход 8 мм.</tspan></text>
