<text x='520' y='380' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='14' fill='#1b1b1a' text-anchor='start' font-weight='normal'><tspan x='520' dy='0.0'>• Стойка — на КАРЕТКУ (она стоит), ножка упирается</tspan><tspan x='520' dy='17.5'>  в поперечные салазки ВДОЛЬ оси X.</tspan><tspan x='520' dy='17.5'>• X на экране — в радиусе или диаметре — неважно:</tspan><tspan x='520' dy='17.5'>  индикатор меряет ход салазок.</tspan><tspan x='520' dy='17.5'>• Тот же натяг 1–2 мм.</tspan></text>
<text x='40' y='530' font-family='DejaVu Sans, Verdana, Arial, sans-serif' font-size='13' fill='#8a8984' text-anchor='start' font-weight='normal'><tspan x='40' dy='0.0'>Вместо индикатора — штангенциркуль глубиномером от упора до каретки: ход 50–100 мм, точность ниже.</tspan></text>
