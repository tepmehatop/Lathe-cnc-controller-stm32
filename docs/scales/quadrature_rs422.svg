<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420"><rect width="100%" height="100%" fill="#fff"/><text x="410.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Квадратура RS-422 (A, /A, B, /B) → приёмник → STM32</text><rect x="20" y="50" width="160" height="220" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="100.0" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Линейка RS-422</text><text x="100.0" y="92" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">+5V, GND</text><text x="100.0" y="109" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">A, /A, B, /B</text><text x="100.0" y="126" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(иногда Z, /Z)</text><rect x="330" y="50" width="170" height="220" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="415.0" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">AM26LV32</text><text x="415.0" y="92" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">4 приёмника RS-422</text><text x="415.0" y="109" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">питание 3.3 В</text><text x="415.0" y="126" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">вход ±7 В</text><rect x="620" y="50" width="180" height="220" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="710.0" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32F407</text><text x="710.0" y="92" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">A → PA15 / PB4</text><text x="710.0" y="109" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">B → PB3 / PB5</text><line x1="180" y1="110" x2="330" y2="110" stroke="#222" stroke-width="2"/><text x="190" y="106" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">A</text><line x1="180" y1="140" x2="330" y2="140" stroke="#222" stroke-width="2"/><text x="190" y="136" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">/A</text><line x1="180" y1="190" x2="330" y2="190" stroke="#222" stroke-width="2"/><text x="190" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">B</text><line x1="180" y1="220" x2="330" y2="220" stroke="#222" stroke-width="2"/><text x="190" y="216" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">/B</text><rect x="250" y="118" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="270" y="113" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">120Ω</text><rect x="250" y="198" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="270" y="193" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">120Ω</text><line x1="500" y1="125" x2="620" y2="125" stroke="#222" stroke-width="2"/><text x="560" y="120" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1Y → A</text><line x1="500" y1="205" x2="620" y2="205" stroke="#222" stroke-width="2"/><text x="560" y="200" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">2Y → B</text><text x="20" y="300" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Резистор 120 Ω между A и /A (и B и /B) — согласование линии, ставится у приёмника.</text><text x="20" y="318" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Выход приёмника — сразу на пин STM32 (уровни 3.3 В), инверсии нет.</text><text x="20" y="336" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Дифференциальный выход лучше всего держит помехи — для длинных кабелей и ЧП.</text><text x="20" y="354" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Конфиг: как у TTL — SCALE_QUADRATURE + разрешение линейки в нм.</text></svg>