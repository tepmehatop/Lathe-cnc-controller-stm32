<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400"><rect width="100%" height="100%" fill="#fff"/><text x="410.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">iGaging EZ-View / AccuRemote / DigiMag (21 бит, 3 В) → STM32</text><rect x="20" y="60" width="170" height="200" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="105.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Линейка iGaging</text><text x="105.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">разъём mini/micro-USB</text><text x="105.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">VCC (≈3 В), GND</text><text x="105.0" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">CLK (D−), DATA (D+)</text><rect x="620" y="60" width="180" height="200" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="710.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32F407</text><text x="710.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">CLK ← PA15 / PB4 (выход)</text><text x="710.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">DATA → PB3 / PB5</text><line x1="190" y1="120" x2="620" y2="120" stroke="#222" stroke-width="2"/><rect x="380" y="113" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="400" y="108" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">470Ω</text><text x="250" y="112" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">CLK (такт от STM32)</text><line x1="190" y1="200" x2="620" y2="200" stroke="#222" stroke-width="2"/><rect x="380" y="193" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="400" y="188" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">470Ω</text><text x="250" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">DATA</text><text x="20" y="290" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Уровни 3 В совместимы с STM32 напрямую; резисторы 470 Ω защищают пины.</text><text x="20" y="308" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Питание линейки — 3.3 В контроллера (у штатного дисплея ≈3 В). Корпус — на GND.</text><text x="20" y="326" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Такт выдаёт STM32 (50 опросов/с) → SCALE_*_TYPE = SCALE_IGAGING21, SIGNAL_INVERT = 0.</text><text x="20" y="344" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Цвета проводов не стандартны — сверяйте по контактам платы линейки.</text></svg>