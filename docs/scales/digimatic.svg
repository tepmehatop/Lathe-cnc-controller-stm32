<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430"><rect width="100%" height="100%" fill="#fff"/><text x="410.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Mitutoyo Digimatic (SPC): REQ / CLK / DATA → STM32</text><rect x="20" y="60" width="170" height="230" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="105.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Прибор Mitutoyo</text><text x="105.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">кабель SPC</text><text x="105.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">GND, DATA, CLK,</text><text x="105.0" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">REQ, READY</text><rect x="620" y="60" width="180" height="230" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="710.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32F407</text><text x="710.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">CLK → PA15 / PB4</text><text x="710.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">DATA → PB3 / PB5</text><text x="710.0" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">REQ ← PE4 / PE5</text><line x1="190" y1="110" x2="620" y2="110" stroke="#222" stroke-width="2"/><text x="200" y="104" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">CLK</text><circle cx="520" cy="110" r="4" fill="#222"/><line x1="520" y1="110" x2="520" y2="95" stroke="#222" stroke-width="2"/><rect x="513" y="55" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="532" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">10k</text><text x="528" y="50" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">+3.3V</text><line x1="190" y1="170" x2="620" y2="170" stroke="#222" stroke-width="2"/><text x="200" y="164" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">DATA</text><circle cx="520" cy="170" r="4" fill="#222"/><line x1="520" y1="170" x2="520" y2="155" stroke="#222" stroke-width="2"/><rect x="513" y="115" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="532" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">10k</text><text x="528" y="110" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">+3.3V</text><text x="200" y="234" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">REQ</text><line x1="190" y1="240" x2="400" y2="240" stroke="#222" stroke-width="2"/><rect x="400" y="215" width="120" height="55" rx="6" fill="#fff" stroke="#335" stroke-width="2"/><text x="460.0" y="237" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">NPN BC547</text><text x="460.0" y="257" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">К → REQ, Э → GND</text><line x1="520" y1="240" x2="620" y2="240" stroke="#222" stroke-width="2"/><rect x="560" y="233" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="580" y="228" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">4.7k</text><text x="570" y="262" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#111">база ← PE4/PE5</text><text x="20" y="320" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• DATA и CLK прибора — открытый коллектор: подтяжка 10k к 3.3 В, инверсии нет (SIGNAL_INVERT = 0).</text><text x="20" y="338" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• REQ: STM32 выдаёт «1» → транзистор прижимает REQ к земле → прибор отправляет 52 бита.</text><text x="20" y="356" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Опрос 20 раз в секунду. Конфиг: SCALE_*_TYPE = SCALE_DIGIMATIC.</text><text x="20" y="374" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Распиновка разъёма — в руководстве прибора (Mitutoyo 99MAH059).</text></svg>