<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330"><rect width="100%" height="100%" fill="#fff"/><text x="410.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Два способа подключения линеек к контроллеру ELS</text><rect x="20" y="60" width="150" height="90" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="95.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Линейки</text><text x="95.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">любые, которые</text><text x="95.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">понимает блок DRO</text><rect x="250" y="60" width="170" height="90" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="335.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Блок DRO</text><text x="335.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">HS800-2</text><text x="335.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(свой экран)</text><rect x="520" y="60" width="280" height="90" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="660.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32 ELS</text><text x="660.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ELS_POS_SOURCE =</text><text x="660.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">POS_SOURCE_DRO_UART</text><line x1="170" y1="105" x2="250" y2="105" stroke="#222" stroke-width="2"/><line x1="420" y1="105" x2="520" y2="105" stroke="#222" stroke-width="2"/><text x="470" y="98" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">UART</text><rect x="20" y="190" width="150" height="90" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="95.0" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Линейки</text><text x="95.0" y="232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">квадратура или</text><text x="95.0" y="249" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ёмкостные</text><rect x="250" y="190" width="170" height="90" rx="6" fill="#fff6f6" stroke="#335" stroke-width="2"/><text x="335.0" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Схема</text><text x="335.0" y="232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">сопряжения</text><text x="335.0" y="249" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(см. ниже)</text><rect x="520" y="190" width="280" height="90" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="660.0" y="212" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32 ELS</text><text x="660.0" y="232" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ELS_POS_SOURCE =</text><text x="660.0" y="249" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">POS_SOURCE_SCALES</text><line x1="170" y1="235" x2="250" y2="235" stroke="#222" stroke-width="2"/><line x1="420" y1="235" x2="520" y2="235" stroke="#222" stroke-width="2"/><text x="20" y="315" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">Способ 1 — сверху: блок DRO остаётся. Способ 2 — снизу: без блока DRO, линейки напрямую.</text></svg>