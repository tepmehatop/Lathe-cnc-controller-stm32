<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"><rect width="100%" height="100%" fill="#fff"/><text x="410.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Квадратура TTL 5 В: стеклянные и магнитные линейки → STM32</text><rect x="20" y="50" width="140" height="250" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="90.0" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Линейка</text><text x="90.0" y="92" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">DB9 / 5-pin</text><text x="90.0" y="109" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">+5V, GND, A, B</text><text x="90.0" y="126" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">(распиновка —</text><text x="90.0" y="143" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">по паспорту)</text><rect x="600" y="50" width="200" height="250" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="700.0" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32F407</text><text x="700.0" y="92" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ось Z: A→PA15, B→PB3</text><text x="700.0" y="109" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">ось X: A→PB4, B→PB5</text><text x="170" y="124" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111">A</text><line x1="160" y1="130" x2="260" y2="130" stroke="#222" stroke-width="2"/><circle cx="230" cy="130" r="4" fill="#222"/><line x1="230" y1="130" x2="230" y2="100" stroke="#222" stroke-width="2"/><rect x="223" y="60" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="242" y="85" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">2.2k</text><line x1="230" y1="60" x2="230" y2="50" stroke="#222" stroke-width="2"/><text x="238" y="48" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">+5V</text><rect x="260" y="123" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="280" y="118" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><line x1="300" y1="130" x2="360" y2="130" stroke="#222" stroke-width="2"/><circle cx="330" cy="130" r="4" fill="#222"/><line x1="330" y1="130" x2="330" y2="144" stroke="#222" stroke-width="2"/><line x1="320" y1="144" x2="340" y2="144" stroke="#222" stroke-width="2"/><line x1="320" y1="150" x2="340" y2="150" stroke="#222" stroke-width="2"/><line x1="330" y1="150" x2="330" y2="160" stroke="#222" stroke-width="2"/><line x1="320" y1="160" x2="340" y2="160" stroke="#222" stroke-width="2"/><line x1="324" y1="164" x2="336" y2="164" stroke="#222" stroke-width="2"/><line x1="328" y1="168" x2="332" y2="168" stroke="#222" stroke-width="2"/><text x="344" y="150" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1n</text><line x1="360" y1="130" x2="420" y2="130" stroke="#222" stroke-width="2"/><polygon points="420,112 420,148 455,130" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="460" cy="130" r="5" fill="#fff" stroke="#222" stroke-width="2"/><line x1="465" y1="130" x2="600" y2="130" stroke="#222" stroke-width="2"/><text x="612" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111">A (PA15 / PB4)</text><text x="170" y="224" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111">B</text><line x1="160" y1="230" x2="260" y2="230" stroke="#222" stroke-width="2"/><circle cx="230" cy="230" r="4" fill="#222"/><line x1="230" y1="230" x2="230" y2="200" stroke="#222" stroke-width="2"/><rect x="223" y="160" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="242" y="185" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">2.2k</text><line x1="230" y1="160" x2="230" y2="150" stroke="#222" stroke-width="2"/><text x="238" y="148" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">+5V</text><rect x="260" y="223" width="40" height="14" fill="#fff" stroke="#222" stroke-width="2"/><text x="280" y="218" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">1k</text><line x1="300" y1="230" x2="360" y2="230" stroke="#222" stroke-width="2"/><circle cx="330" cy="230" r="4" fill="#222"/><line x1="330" y1="230" x2="330" y2="244" stroke="#222" stroke-width="2"/><line x1="320" y1="244" x2="340" y2="244" stroke="#222" stroke-width="2"/><line x1="320" y1="250" x2="340" y2="250" stroke="#222" stroke-width="2"/><line x1="330" y1="250" x2="330" y2="260" stroke="#222" stroke-width="2"/><line x1="320" y1="260" x2="340" y2="260" stroke="#222" stroke-width="2"/><line x1="324" y1="264" x2="336" y2="264" stroke="#222" stroke-width="2"/><line x1="328" y1="268" x2="332" y2="268" stroke="#222" stroke-width="2"/><text x="344" y="250" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">1n</text><line x1="360" y1="230" x2="420" y2="230" stroke="#222" stroke-width="2"/><polygon points="420,212 420,248 455,230" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="460" cy="230" r="5" fill="#fff" stroke="#222" stroke-width="2"/><line x1="465" y1="230" x2="600" y2="230" stroke="#222" stroke-width="2"/><text x="612" y="235" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#111">B (PB3 / PB5)</text><text x="437" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">74LVC14</text><text x="437" y="196" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#111">(питание 3.3 В)</text><text x="20" y="330" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• 74LVC14 — триггер Шмитта: убирает дребезг и помехи ЧП/моторов, входы терпят 5 В.</text><text x="20" y="348" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  Инвертируются оба канала — направление счёта не меняется.</text><text x="20" y="366" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• 2.2k на +5 В нужны для линеек с открытым коллектором; с двухтактным выходом не мешают.</text><text x="20" y="384" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Минимальный вариант: только резистор 1k от линейки к пину STM32 (пины толерантны к 5 В).</text><text x="20" y="402" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Питание линейки +5 В (до ~100 мА) через самовосстанавливающийся предохранитель.</text><text x="20" y="420" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Экран кабеля — на GND контроллера, только с одной стороны.</text><text x="20" y="438" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Конфиг: SCALE_*_TYPE = SCALE_QUADRATURE, SCALE_*_NM_PER_COUNT = 5000 (5 мкм) / 1000 (1 мкм)</text></svg>