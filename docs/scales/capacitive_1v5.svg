<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520"><rect width="100%" height="100%" fill="#fff"/><text x="410.0" y="26" font-family="Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">Ёмкостные линейки 1.5 В (Sylvac 48 бит, BIN6) → компаратор → STM32</text><rect x="20" y="60" width="150" height="220" rx="6" fill="#fdf3e6" stroke="#335" stroke-width="2"/><text x="95.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Линейка 1.5 В</text><text x="95.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">4-контактный разъём</text><text x="95.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">+1.5V, GND</text><text x="95.0" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">CLK, DATA</text><rect x="330" y="60" width="170" height="220" rx="6" fill="#eef4fb" stroke="#335" stroke-width="2"/><text x="415.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">LM393</text><text x="415.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">компаратор</text><text x="415.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">питание 3.3 В</text><text x="415.0" y="136" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">выход — откр. коллектор</text><rect x="640" y="60" width="160" height="220" rx="6" fill="#eaf6ea" stroke="#335" stroke-width="2"/><text x="720.0" y="82" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">STM32F407</text><text x="720.0" y="102" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">CLK → PA15 / PB4</text><text x="720.0" y="119" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">DATA → PB3 / PB5</text><line x1="170" y1="130" x2="330" y2="130" stroke="#222" stroke-width="2"/><text x="180" y="124" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">CLK → IN+</text><line x1="170" y1="210" x2="330" y2="210" stroke="#222" stroke-width="2"/><text x="180" y="204" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">DATA → IN+</text><line x1="250" y1="165" x2="330" y2="165" stroke="#222" stroke-width="2"/><text x="180" y="160" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">Uоп 0.75 В → IN−</text><text x="180" y="182" font-family="Arial, sans-serif" font-size="11" text-anchor="start" fill="#555">(делитель 10k/10k от 1.5 В)</text><line x1="500" y1="130" x2="640" y2="130" stroke="#222" stroke-width="2"/><circle cx="580" cy="130" r="4" fill="#222"/><line x1="580" y1="130" x2="580" y2="105" stroke="#222" stroke-width="2"/><rect x="573" y="65" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="592" y="90" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">4.7k</text><text x="588" y="60" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">+3.3V</text><line x1="500" y1="210" x2="640" y2="210" stroke="#222" stroke-width="2"/><circle cx="580" cy="210" r="4" fill="#222"/><line x1="580" y1="210" x2="580" y2="185" stroke="#222" stroke-width="2"/><rect x="573" y="145" width="14" height="40" fill="#fff" stroke="#222" stroke-width="2"/><text x="592" y="170" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">4.7k</text><text x="588" y="140" font-family="Arial, sans-serif" font-size="12" text-anchor="start" fill="#111">+3.3V</text><rect x="20" y="300" width="280" height="60" rx="6" fill="#fff6f6" stroke="#335" stroke-width="2"/><text x="160.0" y="322" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#111">Питание линейки 1.5 В</text><text x="160.0" y="342" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">TLV70215 (или LM317 на 1.52 В)</text><text x="20" y="385" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">⚠ У большинства китайских линеек 1.5 В корпус соединён с «+» питания. Если корпус</text><text x="20" y="403" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  касается заземлённой станины, а «−» линейки — на GND контроллера, источник 1.5 В замкнётся.</text><text x="20" y="421" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  Корпус линейки изолировать от станины ИЛИ питать линейку от развязанного источника.</text><text x="20" y="439" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Компаратор не инвертирует → SCALE_*_SIGNAL_INVERT = 0.</text><text x="20" y="457" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">  Вариант на одном NPN (BC547, база через 10k) инвертирует → SIGNAL_INVERT = 1.</text><text x="20" y="475" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333">• Конфиг: SCALE_SYLVAC48 (2×24 бит) или SCALE_BIN6 (24 бит). ⚠ Схема требует проверки сообществом.</text></svg>