al, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">Задний</text><line x1="560.0" y1="92.0" x2="560.0" y2="244.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><line x1="196.0" y1="244.0" x2="560.0" y2="244.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/><circle cx="560.0" cy="244.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="249.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" text-anchor="start" fill="#555">общий</text><text x="700.0" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">Кнопки без фиксации — ставят и</text><text x="700.0" y="113.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">снимают упор в текущей точке</text><text x="700.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">(в подрежиме «Ручной»).</text><text x="20.0" y="304.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J12 «СВЕТОДИОДЫ» — светодиоды упоров</text><rect x="150.0" y="338.0" width="46.0" height="200.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="328.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J12</text><rect x="163.0" y="353.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="367.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#f08c00">+3V</text><text x="204.0" y="356.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="391.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="405.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font