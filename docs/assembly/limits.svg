0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Левый: катод (−, короткая ножка) — к разъёму</text><line x1="196.0" y1="438.0" x2="470.0" y2="438.0" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/><path d="M470 438.0 L500 425.0 L500 451.0 Z" stroke="#222" stroke-width="2" fill="#ffd34d" stroke-linecap="round" stroke-linejoin="round"/><line x1="470.0" y1="425.0" x2="470.0" y2="451.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="500.0" y1="438.0" x2="560.0" y2="438.0" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="438.0" r="3.5" fill="#f08c00" stroke="#f08c00" stroke-width="2"/><text x="574.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Правый: катод (−, короткая ножка) — к разъёму</text><line x1="196.0" y1="476.0" x2="470.0" y2="476.0" stroke="#7b2cbf" stroke-width="4" stroke-linecap="round"/><path d="M470 476.0 L500 463.0 L500 489.0 Z" stroke="#222" stroke-width="2" fill="#ffd34d" stroke-linecap="round" stroke-linejoin="round"/><line x1="470.0" y1="463.0" x2="470.0" y2="489.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="500.0" y1="476.0" x2="560.0" y2="476.0" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="476.0" r="3.5" fill="#f08c00" stroke="#f08c00" stroke-width="2"/><text x="574.0" y="481.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Передний: катод (−, короткая ножка) — к разъёму</text><line x1="196.0" y1="514.0" x2="470.0" y2="514.0" stroke="#c9a227" stroke-width="4" stroke-linecap="round"/><path d="M470 514.0 L500 501.0 L500 527.0 Z" stroke="#222" stroke-width="2" fill="#ffd34d" stroke-linecap="round" stroke-linejoin="round"/><line x1="470.0" y1="501.0" x2="470.0" y2="527.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="500.0" y1="514.0" x2="560.0" y2="514.0" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="514.0" r="3.5" fill="#f08c00" stroke="#f08c00" stroke-width="2"/><text x="574.0" y="519.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111">Задний: катод (−, короткая ножка) — к разъёму</text><line x1="560.0" y1="362.0" x2="560.0" y2="514.0" stroke="#f08c00" stroke-width="3" stroke-linecap="round"/><text x="574.0" y="367.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" text-anchor="start" fill="#555">аноды (+, длинная ножка) — вместе на +3V</text><text x="20.0" y="564.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Светодиод горит, когда упор поставлен. Резисторы 220 Ом — на шилде, свои не нужны.</text><text x="20.0" y="583.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Только красные, жёлтые или зелёные (от 3.3 В). Синие и белые светить не будут.</text><text x="20.0" y="602.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Кнопки «со светодиодом» (16 мм) подходят, если светодиод в них без резистора на 12/24 В — иначе не загорится.</text></svg>