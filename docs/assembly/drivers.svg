font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#888">VCC, GND — блок 24–48 В</text><text x="20.0" y="478.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J6 «ДРАЙВЕР X» — драйвер мотора X (суппорт, поперечная)</text><rect x="150.0" y="512.0" width="46.0" height="238.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="502.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J6</text><rect x="163.0" y="527.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="541.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">PUL+</text><text x="204.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="565.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="579.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">PUL-</text><text x="204.0" y="568.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="603.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="617.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">DIR+</text><text x="204.0" y="606.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="641.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="655.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">DIR-</text><text x="204.0" y="644.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="163.0" y="679.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="693.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">ENA+</text><text x="204.0" y="682.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">5</text><rect x="163.0" y="717.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="731.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ENA-</text><text x="204.0" y="720.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">6</text><rect x="640.0" y="512.0" width="330.0" height="374.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="536.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Драйвер мотора X</text><text x="805.0" y="556.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">DM542, DM556, TB6600…</text><path d="M196.0 536.0 H388.0 C418.0 536.0 418.0 582.0 448.0 582.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="582.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="587.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">PUL+</text><path d="M196.0 574.0 H388.0 C418.0 574.0 418.0 620.0 448.0 620.0 H640.0" stroke="#7b2cbf" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="620.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="625.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">PUL−</text><path d="M196.0 612.0 H388.0 C418.0 612.0 418.0 658.0 448.0 658.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="658.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="663.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">DIR+</text><path d="M196.0 650.0 H388.0 C418.0 650.0 418.0 696.0 448.0 696.0 H640.0" stroke="#6a994e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="696.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="701.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">DIR−</text><path d="M196.0 688.0 H388.0 C418.0 688.0 418.0 734.0 448.0 734.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="734.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="739.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">ENA+</text><path d="M196.0 726.0 H388.0 C418.0 726.0 418.0 772.0 448.0 772.0 H640.0" stroke="#3a86ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="772.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="777.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">ENA−</text><circle cx="640.0" cy="810.0" r="6" fill="#eee" stroke="#aaa" stroke-width="2"/><text x="654.0" y="815.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#888">A+ A− B+ B− — обмотки мотора</text><circle cx="640.0" cy="848.0" r="6" fill="#eee" stroke="#aaa" stroke-width="2"/><text x="654.0" y="853.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#888">VCC, GND — блок 24–48 В</text><text x="20.0" y="912.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Провода — один в один: PUL+ к PUL+, PUL− к PUL− и т. д. Витая пара или плоский кабель, до 2 м.</text><text x="20.0" y="931.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• На «+» шилд даёт +5 В, «−» замыкает транзистор на шилде (как у автора 7e2). В прошивке DRIVER_SIGNALS_DIRECT 0.</text><text x="20.0" y="950.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Переключатели драйвера: микрошаг — как в «МЕХАНИКА» → «Микрошаг» (по умолчанию 800 шагов/об = ×4),</text><text x="20.0" y="969.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  ток — по мотору (номинал из паспорта мотора), «половинный ток в покое» — включить.</text><text x="20.0" y="988.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• ENA: как у автора 7e2, перед движением на ENA подаётся ток («включено»). У многих DM542/TB6600 ток через ENA,</text><text x="20.0" y="1007.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  наоборот, отключает мотор. Если при движении мотор свободно крутится рукой и не едет — не подключайте ENA+/ENA−.</text><text x="20.0" y="1026.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Обмотки мотора: A+ A− — одна обмотка (у 4-проводного: прозвонить, между проводами одной обмотки — 1–3 Ом).</text><text x="20.0" y="1045.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  Ось едет в обратную сторону — поменяйте местами A+ и A−.</text><text x="20.0" y="1064.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Блок 24–48 В — только для драйверов: «минус» блока с GND шилда не соединяйте.</text></svg>