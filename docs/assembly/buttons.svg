ont-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">разомкнутые. Дублируют кнопки</text><text x="700.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">на экране.</text><text x="20.0" y="342.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J10 «ДЖОЙСТИК» — джойстик и кнопка ускоренного хода</text><rect x="150.0" y="376.0" width="46.0" height="238.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="366.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J10</text><rect x="163.0" y="391.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="405.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ЛЕВ</text><text x="204.0" y="394.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="429.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ПРАВ</text><text x="204.0" y="432.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="467.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="481.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ВВЕРХ</text><text x="204.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="505.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="519.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ВНИЗ</text><text x="204.0" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="163.0" y="543.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="557.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">БЫСТР</text><text x="204.0" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">5</text><rect x="163.0" y="581.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="595.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="584.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">6</text><line x1="196.0" y1="400.0" x2="470.0" y2="400.0" stroke="#1d70b8" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="400.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="400.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="400.0" x2="516.0" y2="386.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="495.0" y1="392.0" x2="495.0" y2="378.0" stroke="#222" stroke-width="2" stroke-linecap="round"/><line x1="487.0" y1="378.0" x2="503.0" y2="378.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="400.0" x2="560.0" y2="400.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="400.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="405.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">Влево (к патрону)</text><line x1="196.0" y1="438.0" x2="470.0" y2="438.0" stroke="#2a9d8f" stroke-width="4" stroke