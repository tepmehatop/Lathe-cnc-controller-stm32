or="start" fill="#555">общий</text><text x="700.0" y="402.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">Джойстик на 4 положения с</text><text x="700.0" y="421.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">самовозвратом (4 микровыключателя),</text><text x="700.0" y="440.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">кнопка ускоренного хода — на</text><text x="700.0" y="459.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">ручке или рядом.</text><text x="20.0" y="640.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Один вывод каждого контакта — на свой вывод разъёма, вторые выводы всех контактов — вместе на GND.</text><text x="20.0" y="659.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Подтяжки 1 кОм к 3.3 В — на шилде; внешних резисторов не нужно. Провода до 1.5 м, лучше витые с GND.</text><text x="20.0" y="678.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Направление джойстика неверное? Поменяйте местами провода «Влево» и «Вправо» (или «Вверх» и «Вниз»).</text></svg>