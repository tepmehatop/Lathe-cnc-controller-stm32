<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="805" viewBox="0 0 1000 805"><rect width="100%" height="100%" fill="#fff"/><text x="20.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J15 «ЗУММЕР» — зуммер</text><rect x="150.0" y="68.0" width="46.0" height="86.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J15</text><rect x="163.0" y="83.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="121.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">-</text><text x="204.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="640.0" y="68.0" width="330.0" height="146.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Активный зуммер 5 В</text><text x="805.0" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">со встроенным генератором</text><path d="M196.0 92.0 H388.0 C418.0 92.0 418.0 138.0 448.0 138.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="138.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">«+» (длинная ножка)</text><path d="M196.0 130.0 H388.0 C418.0 130.0 418.0 176.0 448.0 176.0 H640.0" stroke="#7b2cbf" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="176.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="181.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">«−»</text><text x="20.0" y="240.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J16 «ТАХОМЕТР» — тахометр (необязательно)</text><rect x="150.0" y="274.0" width="46.0" height="124.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J16</text><rect x="163.0" y="289.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="303.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="292.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="327.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="341.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="365.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="379.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ИМП</text><text x="204.0" y="368.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="640.0" y="274.0" width="330.0" height="184.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="298.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Тахометр / счётчик</text><text x="805.0" y="318.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">вход импульсов</text><path d="M196.0 298.0 H388.0 C418.0 298.0 418.0 344.0 448.0 344.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="344.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="349.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">питание +5 В</text><path d="M196.0 336.0 H388.0 C418.0 336.0 418.0 382.0 448.0 382.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="382.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="387.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">GND</text><path d="M196.0 374.0 H388.0 C418.0 374.0 418.0 420.0 448.0 420.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="420.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="425.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">вход импульса</text><text x="20.0" y="484.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J17 «ПОДАЧА» — переменный резистор подачи (необязательно)</text><rect x="150.0" y="518.0" width="46.0" height="124.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="508.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J17</text><rect x="163.0" y="533.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="547.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#f08c00">+3V</text><text x="204.0" y="536.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="571.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="585.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">СР</text><text x="204.0" y="574.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="609.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="623.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="612.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="640.0" y="518.0" width="330.0" height="184.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="542.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Переменный резистор</text><text x="805.0" y="562.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">10 кОм, линейный (B10K)</text><path d="M196.0 542.0 H388.0 C418.0 542.0 418.0 588.0 448.0 588.0 H640.0" stroke="#f08c00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="588.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="593.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">крайний вывод</text><path d="M196.0 580.0 H388.0 C418.0 580.0 418.0 626.0 448.0 626.0 H640.0" stroke="#7b2cbf" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="626.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="631.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">средний (движок)</text><path d="M196.0 618.0 H388.0 C418.0 618.0 418.0 664.0 448.0 664.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="664.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="669.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">другой крайний</text><text x="20.0" y="728.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Зуммер — активный (пищит от постоянного напряжения). Пассивный пищать не будет.</text><text x="20.0" y="747.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Тахометр: импульс 3.3 В на каждый оборот шпинделя (через 100 Ом на шилде).</text><text x="20.0" y="766.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Переменник: только к +3V шилда, не к 5 В. Подача растёт не в ту сторону — поменяйте крайние выводы.</text><text x="20.0" y="785.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  Без переменника в прошивке USE_FEED_POT 0 — подача задаётся с экрана и кнопками.</text></svg>