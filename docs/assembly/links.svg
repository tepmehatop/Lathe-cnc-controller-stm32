<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1202" viewBox="0 0 1000 1202"><rect width="100%" height="100%" fill="#fff"/><text x="20.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J19 «ДИСПЛЕЙ» — сенсорный дисплей 10.1" (разъём CN2 «INPUT»)</text><rect x="150.0" y="68.0" width="46.0" height="162.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J19</text><rect x="163.0" y="83.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="121.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="159.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="173.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">TX</text><text x="204.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="197.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="211.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">RX</text><text x="204.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="640.0" y="68.0" width="330.0" height="222.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Дисплей JC8012P4A1C</text><text x="805.0" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">разъём CN2: MX 1.25 мм, 4 конт.</text><path d="M196.0 130.0 H388.0 C418.0 130.0 418.0 138.0 448.0 138.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="138.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">1 — VIN (5 В)</text><path d="M196.0 92.0 H388.0 C418.0 92.0 418.0 176.0 448.0 176.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="176.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="181.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">4 — GND</text><path d="M196.0 168.0 H388.0 C418.0 168.0 418.0 214.0 448.0 214.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="161.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" text-anchor="start" fill="#444">TX → RX</text><circle cx="640.0" cy="214.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">3 — RXD (приём дисплея)</text><path d="M196.0 206.0 H388.0 C418.0 206.0 418.0 252.0 448.0 252.0 H640.0" stroke="#6a994e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="199.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" text-anchor="start" fill="#444">RX ← TX</text><circle cx="640.0" cy="252.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="257.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">2 — TXD (передача дисплея)</text><text x="20.0" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• TX и RX перекрещиваются: передача шилда — на приём дисплея и наоборот. Номера CN2 — по схеме дисплея.</text><text x="20.0" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Дисплей 10.1" берёт до 1.5 А и питается по VIN от +5V шилда (или от своего USB-C — тогда VIN не подключать).</text><text x="20.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Дисплей 4.3" JC4827W543 — разъём P1 по подписям на его плате: TX шилда → RX (GPIO44), RX шилда ← TX (GPIO43),</text><text x="20.0" y="373.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  GND; питание — от его USB-C или «5V» разъёма P1, если он есть на вашей ревизии.</text><text x="20.0" y="412.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J18 «LCD2004» — LCD2004 с I2C-модулем (запасной экран, необязательно)</text><rect x="150.0" y="446.0" width="46.0" height="162.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="436.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J18</text><rect x="163.0" y="461.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="475.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="464.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="499.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="513.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="502.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="537.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">SDA</text><text x="204.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="575.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="589.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">SCL</text><text x="204.0" y="578.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="640.0" y="446.0" width="330.0" height="222.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="470.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">LCD2004 + I2C (PCF8574)</text><text x="805.0" y="490.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">адрес 0x27 или 0x3F</text><path d="M196.0 470.0 H388.0 C418.0 470.0 418.0 516.0 448.0 516.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="516.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="521.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">GND</text><path d="M196.0 508.0 H388.0 C418.0 508.0 418.0 554.0 448.0 554.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="554.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="559.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">VCC</text><path d="M196.0 546.0 H388.0 C418.0 546.0 418.0 592.0 448.0 592.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="592.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="597.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">SDA</text><path d="M196.0 584.0 H388.0 C418.0 584.0 418.0 630.0 448.0 630.0 H640.0" stroke="#6a994e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="630.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="635.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">SCL</text><text x="20.0" y="694.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J20 «DRO» — блок DRO HS800-2 (если координаты от него)</text><rect x="150.0" y="728.0" width="46.0" height="86.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="718.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J20</text><rect x="163.0" y="743.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="757.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="746.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="781.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="795.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">RX</text><text x="204.0" y="784.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="640.0" y="728.0" width="330.0" height="146.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="752.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Блок DRO HS800-2</text><text x="805.0" y="772.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">выход TTL</text><path d="M196.0 752.0 H388.0 C418.0 752.0 418.0 798.0 448.0 798.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="798.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="803.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">GND</text><path d="M196.0 790.0 H388.0 C418.0 790.0 418.0 836.0 448.0 836.0 H640.0" stroke="#7b2cbf" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="783.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" text-anchor="start" fill="#444">RX ← TX</text><circle cx="640.0" cy="836.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="841.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">TX блока</text><text x="20.0" y="900.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J21 «ОТЛАДКА» — USB-UART для отладки (необязательно)</text><rect x="150.0" y="934.0" width="46.0" height="124.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="924.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J21</text><rect x="163.0" y="949.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="963.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="952.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="987.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="1001.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">TX</text><text x="204.0" y="990.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="1025.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="1039.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">RX</text><text x="204.0" y="1028.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="640.0" y="934.0" width="330.0" height="184.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="958.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">USB-UART (CP2102, CH340)</text><text x="805.0" y="978.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">3.3 В</text><path d="M196.0 958.0 H388.0 C418.0 958.0 418.0 1004.0 448.0 1004.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="1004.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="1009.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">GND</text><path d="M196.0 996.0 H388.0 C418.0 996.0 418.0 1042.0 448.0 1042.0 H640.0" stroke="#7b2cbf" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="989.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" text-anchor="start" fill="#444">TX → RX</text><circle cx="640.0" cy="1042.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="1047.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">RXD адаптера</text><path d="M196.0 1034.0 H388.0 C418.0 1034.0 418.0 1080.0 448.0 1080.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="1027.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" text-anchor="start" fill="#444">RX ← TX</text><circle cx="640.0" cy="1080.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="1085.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">TXD адаптера</text><text x="20.0" y="1144.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• LCD: контраст — винтом на I2C-модуле. Подтяжки к 5 В на модуле лучше снять (на Discovery есть свои к 3 В).</text><text x="20.0" y="1163.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Блок DRO: выход должен быть TTL. RS-232 (±12 В) — только через преобразователь MAX3232.</text><text x="20.0" y="1182.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Отладка: на Discovery вывод TX (PA9) занят USB — передача от STM32 не работает, приём работает. Для станка не нужен.</text></svg>