ke-width="1.5"/><text x="142.0" y="541.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">x10</text><text x="204.0" y="530.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="163.0" y="565.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="579.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="568.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">5</text><line x1="196.0" y1="422.0" x2="470.0" y2="422.0" stroke="#1d70b8" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="422.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="422.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="422.0" x2="516.0" y2="408.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="422.0" x2="560.0" y2="422.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="422.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="427.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">ось Z</text><line x1="196.0" y1="460.0" x2="470.0" y2="460.0" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="460.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="460.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="460.0" x2="516.0" y2="446.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="460.0" x2="560.0" y2="460.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="460.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="465.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">ось X</text><line x1="196.0" y1="498.0" x2="470.0" y2="498.0" stroke="#7b2cbf" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="498.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="498.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="498.0" x2="516.0" y2="484.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="498.0" x2="560.0" y2="498.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="498.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="503.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">×1</text><line x1="196.0" y1="536.0" x2="470.0" y2="536.0" stroke="#c9a227" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="536.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="536.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="536.0" x2="516.0" y2="522.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="536.0" x2="560.0" y2="536.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="536.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="541.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">×10</text><line x1="560.0" y1="422.0" x2="560.0" y2="574.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><line x1="196.0" y1="574.0" x2="560.0" y2="574.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/><circle cx="560.0" cy="574.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="579.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" text-anchor="start" fill="#555">общий</text><text x="700.0" y="424.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">Ось: переключатель Z — выкл — X.</text><text x="700.0" y="443.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">Масштаб: ×1 — 0.01 мм на щелчок,</text><text x="700.0" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">×10 — 0.1 мм.</text><text x="700.0" y="481.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">У готового пульта с маховичком</text><text x="700.0" y="500.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">провода подписаны так же,</text><text x="700.0" y="519.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">общий — COM.</text><text x="20.0" y="624.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Маховичок двигает ось, выбранную переключателем; в среднем положении («выкл») — не двигает ничего.</text><text x="20.0" y="643.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Конденсаторы 10 нФ на A и B — на шилде.</text><text x="20.0" y="662.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Крутится «наоборот» — поменяйте местами A и B.</text><text x="20.0" y="681.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Без РГИ J13 и J14 можно не подключать.</text></svg>