<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="701" viewBox="0 0 1000 701"><rect width="100%" height="100%" fill="#fff"/><text x="20.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J13 «РГИ» — маховичок РГИ (ручной генератор импульсов)</text><rect x="150.0" y="68.0" width="46.0" height="162.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J13</text><rect x="163.0" y="83.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="121.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="159.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="173.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">A</text><text x="204.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="197.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="211.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">B</text><text x="204.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="640.0" y="68.0" width="330.0" height="260.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Маховичок (MPG)</text><text x="805.0" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">100 имп/об, питание 5 В</text><path d="M196.0 92.0 H388.0 C418.0 92.0 418.0 138.0 448.0 138.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="138.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">+5V (VCC)</text><path d="M196.0 130.0 H388.0 C418.0 130.0 418.0 176.0 448.0 176.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="176.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="181.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">0V (GND)</text><path d="M196.0 168.0 H388.0 C418.0 168.0 418.0 214.0 448.0 214.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="214.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">A</text><path d="M196.0 206.0 H388.0 C418.0 206.0 418.0 252.0 448.0 252.0 H640.0" stroke="#6a994e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="252.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="257.0" font-family="Aria