<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="393" viewBox="0 0 1000 393"><rect width="100%" height="100%" fill="#fff"/><text x="20.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J3 «ПИТАНИЕ 5В» — блок питания 5 В</text><rect x="150.0" y="68.0" width="46.0" height="86.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J3</text><rect x="163.0" y="83.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="121.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="640.0" y="68.0" width="320.0" height="184.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="800.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Блок питания 5 В</text><text x="800.0" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">от 2 А; с дисплеем 10.1" — 3 А</text><text x="800.0" y="129.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">(Mean Well RS-15-5, LRS-35-5…)</text><path d="M196.0 92.0 H388.0 C418.0 92.0 418.0 138.0 448.0 138.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="85.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" text-anchor="start" fill="#444">красный 0.75 мм²</text><circle cx="640.0" cy="138.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">+V</text><path d="M196.0 130.0 H388.0 C418.0 130.0 418.0 176.0 448.0 176.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="123.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-style="italic" text-anchor="start" fill="#444">чёрный 0.75 мм²</text><circle cx="640.0" cy="176.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="181.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">−V (COM)</text><circle cx="640.0" cy="214.0" r="6" fill="#eee" stroke="#aaa" stroke-width="2"/><text x="654.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#888">L, N, ⏚ — сеть 220 В</text><text x="20.0" y="278.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Блок питает всё: Discovery (через диод D1 на шилде), дисплей, LCD, энкодеры, линейки, зуммер.</text><text x="20.0" y="297.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Драйверы моторов питаются от своего блока 24–48 В. К шилду он не подключается: «минус» этого блока</text><text x="20.0" y="316.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  с GND шилда не соединяйте — входы драйверов PUL/DIR/ENA развязаны оптронами.</text><text x="20.0" y="335.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Подключение 220 В — только при выключенной вилке; клемма ⏚ блока — на корпус станка.</text><text x="20.0" y="354.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Без блока, только по USB ST-LINK, питается одна Discovery: дисплей и пульт работать не будут.</text><text x="20.0" y="373.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Перед первым включением: мультиметром +5V–GND на J3 — нет короткого; после — 4.9…5.2 В.</text></svg>