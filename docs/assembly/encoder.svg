<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="526" viewBox="0 0 1000 526"><rect width="100%" height="100%" fill="#fff"/><text x="20.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J4 «ЭНКОДЕР» — энкодер шпинделя</text><rect x="150.0" y="68.0" width="46.0" height="162.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J4</text><rect x="163.0" y="83.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="121.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="159.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="173.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">A</text><text x="204.0" y="162.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="197.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="211.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">B</text><text x="204.0" y="200.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="640.0" y="68.0" width="330.0" height="298.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="92.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Энкодер шпинделя</text><text x="805.0" y="112.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">Omron E6B2-CWZ6C, Autonics E40S…</text><text x="805.0" y="129.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">NPN «открытый коллектор», 5–24 В</text><path d="M196.0 92.0 H388.0 C418.0 92.0 418.0 138.0 448.0 138.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="138.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="143.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">коричневый — +V</text><path d="M196.0 130.0 H388.0 C418.0 130.0 418.0 176.0 448.0 176.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="176.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="181.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">синий — 0 V</text><path d="M196.0 168.0 H388.0 C418.0 168.0 418.0 214.0 448.0 214.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="214.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="219.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">чёрный — A</text><path d="M196.0 206.0 H388.0 C418.0 206.0 418.0 252.0 448.0 252.0 H640.0" stroke="#6a994e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="252.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="257.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">белый — B</text><circle cx="640.0" cy="290.0" r="6" fill="#eee" stroke="#aaa" stroke-width="2"/><text x="654.0" y="295.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#888">оранжевый — Z: не подключать, заизолировать</text><circle cx="640.0" cy="328.0" r="6" fill="#eee" stroke="#aaa" stroke-width="2"/><text x="654.0" y="333.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#888">экран кабеля — к GND шилда</text><text x="20.0" y="392.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Цвета — у Omron E6B2-CWZ6C; у других энкодеров смотрите паспорт: «+», «0 V», A, B.</text><text x="20.0" y="411.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Нужен выход NPN (открытый коллектор) или «push-pull» 5 В. Выход «line driver» (A, A−, B, B−) — через</text><text x="20.0" y="430.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  приёмник RS-422 (AM26LS32).</text><text x="20.0" y="449.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Линий на оборот — в «НАСТРОЙКИ» → «МЕХАНИКА» → «Энкодер» (таблицы автора — для 1800). Энкодер вращается</text><text x="20.0" y="468.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  вместе со шпинделем 1:1, без проскальзывания (муфта или зубчатый ремень).</text><text x="20.0" y="487.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Экранированный кабель, отдельно от проводов моторов. Подтяжки 1 кОм и конденсаторы 1 нФ — на шилде.</text><text x="20.0" y="506.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Не крутится в ту сторону (обороты «с минусом»)? Поменяйте местами провода A и B.</text></svg>