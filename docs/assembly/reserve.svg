<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1167" viewBox="0 0 1000 1167"><rect width="100%" height="100%" fill="#fff"/><text x="20.0" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J24 «СБРОС» — кнопка сброса на панель (по желанию)</text><rect x="150.0" y="68.0" width="46.0" height="86.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="58.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J24</text><rect x="163.0" y="83.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">RST</text><text x="204.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="121.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="124.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><line x1="196.0" y1="92.0" x2="470.0" y2="92.0" stroke="#1d70b8" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="92.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="92.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="92.0" x2="516.0" y2="78.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="495.0" y1="84.0" x2="495.0" y2="70.0" stroke="#222" stroke-width="2" stroke-linecap="round"/><line x1="487.0" y1="70.0" x2="503.0" y2="70.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="92.0" x2="560.0" y2="92.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="92.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="97.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">Сброс (кнопка без фиксации)</text><line x1="560.0" y1="92.0" x2="560.0" y2="130.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><line x1="196.0" y1="130.0" x2="560.0" y2="130.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/><circle cx="560.0" cy="130.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="135.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" text-anchor="start" fill="#555">общий</text><text x="700.0" y="94.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">Параллельно кнопке RESET на Discovery —</text><text x="700.0" y="113.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">на случай зависания. На аварийный</text><text x="700.0" y="132.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">«грибок» не заводить: после сброса</text><text x="700.0" y="151.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">теряются упоры.</text><text x="20.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J25 «ДАТЧИК (РЕЗЕРВ)» — датчик / щуп — РЕЗЕРВ (в прошивке пока не используется)</text><rect x="150.0" y="240.0" width="46.0" height="124.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="230.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J25</text><rect x="163.0" y="255.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="269.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="293.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="307.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="296.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="331.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="345.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ВХ</text><text x="204.0" y="334.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="640.0" y="240.0" width="330.0" height="222.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="264.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Датчик (будущее)</text><text x="805.0" y="284.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">щуп привязки резца, касание детали</text><path d="M196.0 264.0 H388.0 C418.0 264.0 418.0 310.0 448.0 310.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="310.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="315.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">+5V</text><path d="M196.0 302.0 H388.0 C418.0 302.0 418.0 348.0 448.0 348.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="348.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="353.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">GND</text><path d="M196.0 340.0 H388.0 C418.0 340.0 418.0 386.0 448.0 386.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="386.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="391.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">выход датчика</text><circle cx="640.0" cy="424.0" r="6" fill="#eee" stroke="#aaa" stroke-width="2"/><text x="654.0" y="429.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#888">контакт на GND или выход NPN</text><text x="20.0" y="488.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J26 «РЕЗЕРВ ВЫХОДЫ PD13 PD15» — резервные выходы PD13, PD15 (в прошивке пока не используются)</text><rect x="150.0" y="522.0" width="46.0" height="162.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="512.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J26</text><rect x="163.0" y="537.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="551.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#d62828">+5V</text><text x="204.0" y="540.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="575.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="589.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="578.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="613.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="627.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">D13</text><text x="204.0" y="616.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="651.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="665.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">D15</text><text x="204.0" y="654.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="640.0" y="522.0" width="330.0" height="222.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="546.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Модули реле и т. п.</text><text x="805.0" y="566.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">3.3 В через 220 Ом, до ~10 мА</text><path d="M196.0 546.0 H388.0 C418.0 546.0 418.0 592.0 448.0 592.0 H640.0" stroke="#d62828" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="592.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="597.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">питание +5 В</text><path d="M196.0 584.0 H388.0 C418.0 584.0 418.0 630.0 448.0 630.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="630.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="635.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">GND</text><path d="M196.0 622.0 H388.0 C418.0 622.0 418.0 668.0 448.0 668.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="668.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="673.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">IN1 ← PD13</text><path d="M196.0 660.0 H388.0 C418.0 660.0 418.0 706.0 448.0 706.0 H640.0" stroke="#6a994e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="706.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="711.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">IN2 ← PD15</text><text x="20.0" y="770.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J27 «РЕЗЕРВ PA5 PA7» — резервные вход/выход PA5, PA7 (в прошивке пока не используются)</text><rect x="150.0" y="804.0" width="46.0" height="162.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="794.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J27</text><rect x="163.0" y="819.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="833.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#f08c00">+3V</text><text x="204.0" y="822.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="857.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="871.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="860.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="895.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="909.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">A5</text><text x="204.0" y="898.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="933.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="947.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">A7</text><text x="204.0" y="936.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><rect x="640.0" y="804.0" width="330.0" height="222.0" rx="6" fill="#fdf6e8" stroke="#8a6d3b" stroke-width="2"/><text x="805.0" y="828.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Что-то своё</text><text x="805.0" y="848.0" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#555">через 470 Ом; АЦП, на PA5 — ЦАП</text><path d="M196.0 828.0 H388.0 C418.0 828.0 418.0 874.0 448.0 874.0 H640.0" stroke="#f08c00" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="874.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="879.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">+3.3 В</text><path d="M196.0 866.0 H388.0 C418.0 866.0 418.0 912.0 448.0 912.0 H640.0" stroke="#222222" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="912.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="917.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">GND</text><path d="M196.0 904.0 H388.0 C418.0 904.0 418.0 950.0 448.0 950.0 H640.0" stroke="#c9a227" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="950.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="955.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">сигнал 1 (PA5)</text><path d="M196.0 942.0 H388.0 C418.0 942.0 418.0 988.0 448.0 988.0 H640.0" stroke="#6a994e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640.0" cy="988.0" r="6" fill="#fff" stroke="#8a6d3b" stroke-width="2"/><text x="654.0" y="993.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#111">сигнал 2 (PA7)</text><text x="20.0" y="1052.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Резервные разъёмы — на будущее: прошивка эти выводы не трогает, пока для них не появится функция.</text><text x="20.0" y="1071.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• PD13 и PD15 — те же выводы, что светодиоды LD3 (оранжевый) и LD6 (синий) на Discovery: включённый выход</text><text x="20.0" y="1090.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  видно по светодиоду. PD12 и PD14 на шилд не выведены — к ним на плате не подойти без длинных обходов.</text><text x="20.0" y="1109.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  Модулю реле нужен вход 3.3 В (или модуль с оптроном, срабатывающий от 3.3 В).</text><text x="20.0" y="1128.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• PA2 (датчик) — это ещё и передача USART2: прошивка оставляет блоку DRO только приём, PA2 — вход.</text><text x="20.0" y="1147.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• PA5/PA7 на Discovery идут и на акселерометр (его входы) — не мешают. Не подавать больше 3.3 В.</text></svg>