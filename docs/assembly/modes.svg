-anchor="start" fill="#333">• Галетный переключатель 1 направление × 8 (или 12) положений. Общий вывод — на GND (выводы 9 и 10 J7).</text><text x="20.0" y="503.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Положение N галетника — на вывод N разъёма: тогда цифра на ручке совпадает с режимом на экране.</text><text x="20.0" y="522.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Удобно: 10-жильный плоский шлейф с розеткой IDC-10 обжимом; на галетнике — каждую жилу на свой лепесток.</text><text x="20.0" y="541.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Галетника нет — режим выбирается на экране (тап по названию режима), J7 можно не подключать.</text><text x="20.0" y="590.0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111">J8 «ПОДРЕЖИМ» — переключатель подрежимов (3 положения)</text><rect x="150.0" y="624.0" width="46.0" height="162.0" rx="3" fill="#f4f4f4" stroke="#555" stroke-width="2"/><text x="173.0" y="614.0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">J8</text><rect x="163.0" y="639.0" width="20.0" height="18.0" rx="1" fill="#c9a227" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="653.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">ВНУТ</text><text x="204.0" y="642.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">1</text><rect x="163.0" y="677.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="691.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">РУЧ</text><text x="204.0" y="680.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">2</text><rect x="163.0" y="715.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="729.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#111">НАР</text><text x="204.0" y="718.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">3</text><rect x="163.0" y="753.0" width="20.0" height="18.0" rx="9" fill="#e6c35c" stroke="#7a5d00" stroke-width="1.5"/><text x="142.0" y="767.0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="end" fill="#222222">GND</text><text x="204.0" y="756.0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#777">4</text><line x1="196.0" y1="648.0" x2="470.0" y2="648.0" stroke="#1d70b8" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="648.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="648.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="648.0" x2="516.0" y2="634.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="648.0" x2="560.0" y2="648.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="648.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="653.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">Внутренний</text><line x1="196.0" y1="686.0" x2="470.0" y2="686.0" stroke="#2a9d8f" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="686.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="686.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="686.0" x2="516.0" y2="672.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="686.0" x2="560.0" y2="686.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="686.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="691.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">Ручной</text><line x1="196.0" y1="724.0" x2="470.0" y2="724.0" stroke="#7b2cbf" stroke-width="4" stroke-linecap="round"/><circle cx="470.0" cy="724.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="520.0" cy="724.0" r="4" fill="#fff" stroke="#222" stroke-width="2"/><line x1="474.0" y1="724.0" x2="516.0" y2="710.0" stroke="#222" stroke-width="2.5" stroke-linecap="round"/><line x1="524.0" y1="724.0" x2="560.0" y2="724.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><circle cx="560.0" cy="724.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="729.0" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111">Наружный</text><line x1="560.0" y1="648.0" x2="560.0" y2="762.0" stroke="#222222" stroke-width="3" stroke-linecap="round"/><line x1="196.0" y1="762.0" x2="560.0" y2="762.0" stroke="#222222" stroke-width="4" stroke-linecap="round"/><circle cx="560.0" cy="762.0" r="3.5" fill="#222222" stroke="#222222" stroke-width="2"/><text x="574.0" y="767.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" text-anchor="start" fill="#555">общий вывод</text><text x="20.0" y="812.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Переключатель на 3 положения, в каждом замкнут один вывод (галетный 1×3 или тумблер ON-ON-ON).</text><text x="20.0" y="831.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">  Тумблер ON-OFF-ON не подойдёт: в среднем положении ничего не замкнуто.</text><text x="20.0" y="850.0" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#333">• Упоры кнопками ставятся только в «Ручном»; автоцикл — в «Наружном» и «Внутреннем».</text></svg>