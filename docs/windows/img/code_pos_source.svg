<text x="60" y="345" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#ffcc66" text-anchor="start" xml:space="preserve">✎ строка 37: #define ELS_POS_SOURCE POS_SOURCE_STEPS  →  #define ELS_POS_SOURCE POS_SOURCE_DRO_UART   — блок DRO</text>
<text x="60" y="374" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#ffcc66" text-anchor="start" font-weight="bold" xml:space="preserve">Пример 1: координаты от блока DRO — или env stm32f407_dro</text>
