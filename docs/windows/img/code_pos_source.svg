<text x="60" y="52" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="start" xml:space="preserve">els_config.h ●</text>
<text x="60" y="80" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="11" fill="#9d9d9d" text-anchor="start" xml:space="preserve">Core › els_config.h</text>
<text x="92" y="106" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">27</text>
<text x="104" y="106" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#c586c0" text-anchor="start" xml:space="preserve">#define POS_SOURCE_STEPS        0   // без линеек: позиция по шагам моторов (как в 7e2 без DRO)</text>
<text x="92" y="127" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">28</text>
<text x="104" y="127" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#c586c0" text-anchor="start" xml:space="preserve">#define POS_SOURCE_DRO_UART     1   // блок DRO HS800-2 по UART (линейки подключены к блоку)</text>
<text x="92" y="148" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">29</text>
<text x="104" y="148" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#c586c0" text-anchor="start" xml:space="preserve">#define POS_SOURCE_SCALES       2   // линейки напрямую к STM32, без блока DRO</text>
<text x="92" y="169" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">30</text>
<text x="104" y="169" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#cccccc" text-anchor="start" xml:space="preserve"></text>
<text x="92" y="190" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">31</text>
<text x="104" y="190" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#6a9955" text-anchor="start" xml:space="preserve">// По умолчанию — без линеек, как исходная 7e2. С блоком DRO или линейками собирайте свой env:</text>
<text x="92" y="211" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">32</text>
<text x="104" y="211" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#6a9955" text-anchor="start" xml:space="preserve">//   pio run -e stm32f407_dro      (блок DRO HS800-2)</text>
<text x="92" y="232" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">33</text>
<text x="104" y="232" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#6a9955" text-anchor="start" xml:space="preserve">//   pio run -e stm32f407_scales   (линейки напрямую, тип — SCALE_Z_TYPE/SCALE_X_TYPE ниже)</text>
<text x="92" y="253" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">34</text>
<text x="104" y="253" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#6a9955" text-anchor="start" xml:space="preserve">// Это исходный источник: на экране (⚠ → НАСТРОЙКИ → ЛИНЕЙКИ) можно выбрать другой — без линеек, блок DRO</text>
<text x="92" y="274" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">35</text>
<text x="104" y="274" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#6a9955" text-anchor="start" xml:space="preserve">// или линейки (тип, разрешение, направление по осям); STM32 сохранит выбор и перезапустится.</text>
<text x="92" y="295" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">36</text>
<text x="104" y="295" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#c586c0" text-anchor="start" xml:space="preserve">#ifndef ELS_POS_SOURCE   // можно переопределить флагом -D при сборке</text>
<rect x="48" y="301" width="885.1999999999999" height="21" rx="0" fill="#264f78" stroke="none" stroke-width="1"/>
<text x="92" y="316" font-family="Consolas, Menlo, monospace" font-size="12" fill="#6e7681" text-anchor="end" xml:space="preserve">37</text>
<text x="104" y="316" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#c586c0" text-anchor="start" xml:space="preserve">#define ELS_POS_SOURCE          POS_SOURCE_DRO_UART</text>
