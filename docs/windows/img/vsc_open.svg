<text x="372" y="190" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#9d9d9d" text-anchor="end" xml:space="preserve">Ctrl+K Ctrl+O</text>
<rect x="57" y="170" width="324" height="30" rx="4" fill="none" stroke="#e0242b" stroke-width="3"/>
<circle cx="398" cy="185" r="13" fill="#e0242b" stroke="#ffffff" stroke-width="2"/>
