<text x="70" y="163" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#cccccc" text-anchor="start" xml:space="preserve">Открыть файл…</text>
<text x="372" y="163" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#9d9d9d" text-anchor="end" xml:space="preserve">Ctrl+O</text>
