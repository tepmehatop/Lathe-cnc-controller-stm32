<text x="60" y="292" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="11" fill="#cccccc" text-anchor="start" xml:space="preserve">ПРОВОДНИК</text>
<text x="60" y="316" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" font-weight="bold" xml:space="preserve">▾ ELS</text>
<text x="72" y="340" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">▸ Core</text>
<text x="72" y="361" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">▸ Drivers</text>
<text x="72" y="382" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">▸ ELS_Display</text>
<text x="72" y="403" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">▸ ELS_Display_P4</text>
<text x="72" y="424" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">▸ ELS_Display_P7</text>
<text x="72" y="445" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">▸ docs</text>
<text x="72" y="466" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">▸ tools</text>
<text x="72" y="487" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">  platformio.ini</text>
<text x="72" y="508" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="start" xml:space="preserve">  README.md</text>
<rect x="63" y="319" width="276" height="202" rx="4" fill="none" stroke="#e0242b" stroke-width="3"/>
<circle cx="360" cy="420" r="13" fill="#e0242b" stroke="#ffffff" stroke-width="2"/>
<text x="360" y="425" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" xml:space="preserve">2</text>
<text x="420" y="340" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#cccccc" text-anchor="start" xml:space="preserve">Папка C:\els — та, где лежит platformio.ini.</text>
<text x="420" y="364" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#cccccc" text-anchor="start" xml:space="preserve">При первом открытии PlatformIO скачивает компиляторы</text>
<text x="420" y="388" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#cccccc" text-anchor="start" xml:space="preserve">для STM32 и ESP32 (около 2 ГБ, 10–30 минут) — внизу</text>
<text x="420" y="412" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#cccccc" text-anchor="start" xml:space="preserve">бежит строка «Configuring project…». Дождитесь конца.</text>
<text x="992" y="554" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="10" fill="#9aa0a6" text-anchor="end" xml:space="preserve">схема окна (рисунок), не снимок экрана</text>
