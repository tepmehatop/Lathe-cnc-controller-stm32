<rect x="0" y="0" width="760" height="32" rx="0" fill="#f3f3f3" stroke="none" stroke-width="1"/>
<text x="14" y="21" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#202020" text-anchor="start" xml:space="preserve">Диспетчер устройств</text>
<text x="640" y="21" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#404040" text-anchor="middle" xml:space="preserve">—</text>
<text x="680" y="21" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#404040" text-anchor="middle" xml:space="preserve">☐</text>
<text x="720" y="21" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#404040" text-anchor="middle" xml:space="preserve">✕</text>
<text x="14" y="54" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#303030" text-anchor="start" xml:space="preserve">Файл    Действие    Вид    Справка</text>
<line x1="0" y1="66" x2="760" y2="66" stroke="#c8c8c8" stroke-width="1"/>
<text x="24" y="92" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">▸  Аудиовходы и аудиовыходы</text>
<text x="24" y="122" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">▸  Видеоадаптеры</text>
<text x="24" y="152" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">▸  Дисковые устройства</text>
<text x="24" y="182" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">▾  Порты (COM и LPT)</text>
<rect x="58" y="199" width="16" height="16" rx="2" fill="#dfe8f5" stroke="#7c93b8" stroke-width="1"/>
<text x="82" y="212" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">Устройство с последовательным интерфейсом USB (COM5)</text>
<rect x="53" y="192" width="504" height="30" rx="4" fill="none" stroke="#e0242b" stroke-width="3"/>
<circle cx="572" cy="207" r="13" fill="#e0242b" stroke="#ffffff" stroke-width="2"/>
<text x="572" y="212" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" xml:space="preserve">1</text>
<text x="24" y="242" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">▸  Процессоры</text>
<text x="24" y="272" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">▾  Устройства USB</text>
<rect x="58" y="289" width="16" height="16" rx="2" fill="#dfe8f5" stroke="#7c93b8" stroke-width="1"/>
<text x="82" y="302" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">STM32 STLink</text>
<rect x="53" y="282" width="144" height="30" rx="4" fill="none" stroke="#e0242b" stroke-width="3"/>
<circle cx="212" cy="297" r="13" fill="#e0242b" stroke="#ffffff" stroke-width="2"/>
<text x="212" y="302" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" xml:space="preserve">2</text>
<text x="24" y="332" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="14" fill="#202020" text-anchor="start" xml:space="preserve">▸  Устройства HID (Human Interface Devices)</text>
<rect x="24" y="368" width="712" height="66" rx="4" fill="#fff8e1" stroke="#e0b000" stroke-width="1"/>
<text x="36" y="392" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#202020" text-anchor="start" xml:space="preserve">⚠  «Другие устройства» → «STM32 STLink» с жёлтым треугольником — драйвер ST-Link не установлен</text>
<text x="36" y="416" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#202020" text-anchor="start" xml:space="preserve">    (шаг 1.2). Порт дисплея без треугольника и с номером COM — драйвер не нужен.</text>
<text x="752" y="464" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="10" fill="#9aa0a6" text-anchor="end" xml:space="preserve">схема окна (рисунок), не снимок экрана</text>
