<text x="60" y="198" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#ffcc66" text-anchor="start" xml:space="preserve">✎ строка 10: #define WIFI_STA_SSID &quot;&quot;  →  #define WIFI_STA_SSID &quot;MyHomeWiFi&quot;   — сеть роутера</text>
<text x="60" y="219" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#ffcc66" text-anchor="start" xml:space="preserve">✎ строка 11: #define WIFI_STA_PASS &quot;&quot;  →  #define WIFI_STA_PASS &quot;пароль_роутера&quot;   — пароль</text>
<text x="60" y="248" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="13" fill="#ffcc66" text-anchor="start" font-weight="bold" xml:space="preserve">Пример 9: Wi-Fi в прошивке дисплея — копия шаблона под именем wifi_config.h (проще — на экране)</text>
